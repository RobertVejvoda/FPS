# dapr.yaml — FairSpot multi-app run configuration for local smoke testing.
# Usage: dapr run -f dapr.yaml
#
# Prerequisites (in order):
#   1. ./tools/start-local-harness.sh        ← REQUIRED — starts Docker infra AND
#      seeds Vault with mongodb-credentials, rabbitmq-credentials, minio-credentials.
#      All state store components in code/infrastructure/dapr/components/local/ read
#      credentials from Vault. If Vault is unseeded the state stores never initialise
#      and Customer will exhaust 60 health retries before giving up.
#
#      Alternatively, seed Vault manually:
#        docker compose -f code/infrastructure/docker-compose.yaml up -d
#        curl -s --request POST http://localhost:8200/v1/secret/data/mongodb-credentials \
#          -H "X-Vault-Token: root" \
#          -H "Content-Type: application/json" \
#          -d '{"data":{"username":"admin","password":"admin"}}'
#
#   2. ./tools/dev-setup-auth.sh
#   3. source ./tools/dev-env.sh
#   4. dotnet build code/server/FPS.sln --no-restore
#
# Requires: Dapr CLI >= 1.18  (https://docs.dapr.io/getting-started/install-dapr-cli/)

version: 1
common:
  resourcesPath: code/infrastructure/dapr/components/local
  configFilePath: code/infrastructure/dapr/configuration/fairspot-smoke-config.yaml
  # The host-local harness uses durable local components. The smoke config
  # intentionally omits tracing because fairspot-config.yaml references Docker-network
  # endpoints that host-local Dapr sidecars cannot resolve.
  env:
    ASPNETCORE_ENVIRONMENT: Development
    DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"

apps:
  - appID: fairspot-identity
    appDirPath: code/server/Identity/FPS.Identity
    appPort: 5192
    daprHTTPPort: 3602
    daprGRPCPort: 50002
    command: ["dotnet", "run", "--no-build", "--no-launch-profile", "--", "--urls", "http://0.0.0.0:5192"]

  - appID: fairspot-booking
    appDirPath: code/server/Booking/FPS.Booking
    appPort: 5131
    daprHTTPPort: 3601
    daprGRPCPort: 50001
    command: ["dotnet", "run", "--no-build"]

  - appID: fairspot-notification
    appDirPath: code/server/Notification/FPS.Notification
    appPort: 5157
    daprHTTPPort: 3607
    daprGRPCPort: 50007
    command: ["dotnet", "run", "--no-build"]

  - appID: fairspot-profile
    appDirPath: code/server/Profile/FPS.Profile
    appPort: 5197
    daprHTTPPort: 3617
    daprGRPCPort: 50017
    command: ["dotnet", "run", "--no-build"]

  - appID: fairspot-audit
    appDirPath: code/server/Audit/FPS.Audit
    appPort: 5161
    daprHTTPPort: 3611
    daprGRPCPort: 50011
    command: ["dotnet", "run", "--no-build"]

  - appID: fairspot-reporting
    appDirPath: code/server/Reporting/FPS.Reporting
    appPort: 5171
    daprHTTPPort: 3621
    daprGRPCPort: 50021
    command: ["dotnet", "run", "--no-build"]

  - appID: fairspot-configuration
    appDirPath: code/server/Configuration/FPS.Configuration
    appPort: 5141
    daprHTTPPort: 3631
    daprGRPCPort: 50031
    command: ["dotnet", "run", "--no-build"]

  - appID: fairspot-customer
    appDirPath: code/server/Customer/FPS.Customer
    appPort: 5181
    daprHTTPPort: 3641
    daprGRPCPort: 50041
    command: ["dotnet", "run", "--no-build"]

  - appID: fairspot-datahub
    appDirPath: code/server/DataHub/FPS.DataHub
    appPort: 5211
    daprHTTPPort: 3651
    daprGRPCPort: 50151
    command: ["dotnet", "run", "--no-build", "--no-launch-profile", "--", "--urls", "http://0.0.0.0:5211"]
