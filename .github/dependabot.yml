version: 2
updates:
  # GitHub Actions used by our workflows — supply-chain hygiene (keeps
  # actions/checkout, actions/create-github-app-token, etc. current & pinnable).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # .NET server solution
  - package-ecosystem: "nuget"
    directory: "/code/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ASP.NET Core 10 uses the Microsoft.OpenApi 2.x object model. Revisit
      # this hold with the ASP.NET Core 11 migration. See closed PR #820.
      - dependency-name: "Microsoft.OpenApi"
        versions: ["3.*"]

  # Web app
  - package-ecosystem: "npm"
    directory: "/code/web/fps-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Mobile app
  - package-ecosystem: "npm"
    directory: "/code/mobile/fps-mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mobile:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Expo-managed: react-native / react are pinned by the Expo SDK and must be
      # upgraded together via an `expo` SDK bump, not à la carte — bumping them
      # standalone breaks the peer tree (npm ci ERESOLVE). See closed PR #809.
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      # TypeScript 7 is outside the current Expo peer contract. See closed
      # PR #818; revisit with the matching Expo SDK/toolchain migration.
      - dependency-name: "typescript"
        versions: ["7.x"]
