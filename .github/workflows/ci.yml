name: CI

on:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'code/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    # Weekly health check (Mondays at 06:00 UTC) so SDK, dependency, and
    # environment drift is caught even when no PR is active.
    - cron: '0 6 * * 1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Repository validation
        run: ./tools/validate.sh

      - name: Set up Node.js for client stale-check
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: API client stale-check
        run: ./tools/check-api-client-stale.sh

      - name: Install mobile app dependencies
        working-directory: code/mobile/fps-mobile
        run: npm ci

      - name: Mobile app typecheck
        working-directory: code/mobile/fps-mobile
        run: npm run typecheck
