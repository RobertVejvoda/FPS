name: Agent draft on blocking findings (apply)

# PRIVILEGED half of the delivery loop. Both triggers run the trusted DEFAULT-BRANCH version of
# this file (workflow_run / issue_comment), so this is the only place the App key + PROJECT_SYNC
# token are used. It checks out the trusted base tools/, then invokes the repository-neutral
# transition reducer via tools/agent-loop-adapter.mjs, which fetches + verifies the Codex verdict,
# gathers durable state, reduces, and applies exactly one transition.
#
# Serialization is JOB-level and keyed by the TRUSTED PR number, so both verdict channels share
# one `agent-loop-<pr>` group (a workflow-level group could not: workflow_run events lack the PR
# number at group-eval time). The review channel first RESOLVES the trusted PR from
# workflow_run.head_branch — the artifact only gets to agree, never to choose the key — then the
# processing job queues behind any comment-channel run for the same PR (and vice versa). The
# authenticated ledger + pre-effect re-read in the adapter remain as defense-in-depth.

on:
  workflow_run:
    workflows: ["Agent draft on blocking findings"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  # Step 0 (formal-review channel): resolve the TRUSTED PR number before any concurrency
  # gating. Unprivileged — reads the artifact + open-PR list only; no App key.
  resolve:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.res.outputs.pr }}
      review: ${{ steps.res.outputs.review }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the stage-1 signal (absent unless a Codex review fired)
        id: dl
        uses: actions/download-artifact@v4
        with:
          name: agent-loop-signal
          path: signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Resolve the trusted PR and verify the artifact binding
        if: steps.dl.outcome == 'success'
        id: res
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: resolve
          # Trusted binding source: the branch the triggering (stage-1) run executed on.
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          ARTIFACT_PR=$(tr -dc '0-9' < signal/pr-number.txt 2>/dev/null || true)
          REVIEW_ID=$(tr -dc '0-9' < signal/review-id.txt 2>/dev/null || true)
          [ -n "$ARTIFACT_PR" ] && [ -n "$REVIEW_ID" ] || { echo "no signal — nothing to do"; exit 0; }
          ARTIFACT_PR="$ARTIFACT_PR" REVIEW_ID="$REVIEW_ID" node tools/agent-loop-adapter.mjs

  # Path 1: a formal review. Serialized per trusted PR with the comment channel below.
  from-review:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    concurrency:
      group: agent-loop-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run the loop adapter (verdict via formal review)
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BOARD_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: verdict
          PR: ${{ needs.resolve.outputs.pr }}
          REVIEW_ID: ${{ needs.resolve.outputs.review }}
          # Defense-in-depth: the adapter re-checks the PR's head branch against the
          # trusted triggering-run branch (confused-deputy guard).
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          node tools/agent-loop-adapter.mjs

  # Path 2: a conversation verdict (issue_comment is trusted; author verified in the guard).
  from-comment:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    concurrency:
      group: agent-loop-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run the loop adapter (verdict via conversation comment)
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BOARD_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          EVENT: verdict
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          node tools/agent-loop-adapter.mjs
