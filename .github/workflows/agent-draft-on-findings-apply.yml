name: Agent draft on blocking findings (apply)

# PRIVILEGED half of the delivery loop. Both triggers run the trusted DEFAULT-BRANCH version of
# this file (workflow_run / issue_comment), so this is the only place the App key + PROJECT_SYNC
# token are used. It checks out the trusted base tools/, then invokes the repository-neutral
# transition reducer via tools/agent-loop-adapter.mjs, which fetches + verifies the Codex verdict,
# gathers durable state, reduces, and applies exactly one transition.
#
# A per-PR concurrency group serializes transitions; the adapter's ledger marker (and a re-check
# just before acting) backstops any residual cross-channel race.

on:
  workflow_run:
    workflows: ["Agent draft on blocking findings"]
    types: [completed]
  issue_comment:
    types: [created]

# Serialize per PR (comment path) / per head SHA (review path). Perfect cross-channel serialization
# is not achievable — workflow_run lacks the PR at group-eval time — so round INTEGRITY is guaranteed
# instead by counting DISTINCT reviewed SHAs (agent-loop-adapter parseLedger), not comment markers.
concurrency:
  group: agent-loop-${{ github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Path 1: a formal review (via the unprivileged stage-1 signal).
  from-review:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the stage-1 signal (absent unless a Codex review fired)
        id: dl
        uses: actions/download-artifact@v4
        with:
          name: agent-loop-signal
          path: signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Mint app token
        if: steps.dl.outcome == 'success'
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run the loop adapter (verdict via formal review)
        if: steps.dl.outcome == 'success'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BOARD_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: verdict
        run: |
          set -uo pipefail
          PR=$(tr -dc '0-9' < signal/pr-number.txt 2>/dev/null || true)
          REVIEW_ID=$(tr -dc '0-9' < signal/review-id.txt 2>/dev/null || true)
          [ -n "$PR" ] && [ -n "$REVIEW_ID" ] || { echo "no signal — nothing to do"; exit 0; }
          PR="$PR" REVIEW_ID="$REVIEW_ID" node tools/agent-loop-adapter.mjs

  # Path 2: a conversation verdict (issue_comment is trusted; author verified in the guard).
  from-comment:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run the loop adapter (verdict via conversation comment)
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BOARD_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          EVENT: verdict
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          node tools/agent-loop-adapter.mjs
