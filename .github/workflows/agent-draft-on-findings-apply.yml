name: Agent draft on blocking findings (apply)

# Stage 2 of 2 (PRIVILEGED). Triggered when stage 1 (agent-draft-on-findings) completes.
#
# SECURITY: workflow_run always runs the trusted DEFAULT-BRANCH version of this file, so
# a PR branch cannot alter it — this is why the App key is minted here and never in the
# pull_request_review stage. If stage 1 emitted the "draft-signal" artifact (a substantive
# P0/P1/P2 finding), convert the PR to Draft: it becomes unmergeable, the auto-merge gate
# skips drafts, and the orchestrator's pr-converted-to-draft job routes the linked issue
# to Needs changes / Owner=Implementer. No signal artifact => no-op.

on:
  workflow_run:
    workflows: ["Agent draft on blocking findings"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  apply:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download the draft signal (absent unless a substantive finding)
        id: dl
        uses: actions/download-artifact@v4
        with:
          name: draft-signal
          path: signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Mint app token
        if: steps.dl.outcome == 'success'
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Convert the PR to Draft + hand back to the implementer
        if: steps.dl.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          # Authoritative PR list from the workflow_run event (from GitHub, not the artifact).
          WR_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -uo pipefail

          PR=$(tr -dc '0-9' < signal/pr-number.txt 2>/dev/null || true)
          [ -n "$PR" ] || { echo "No PR number in signal — nothing to do."; exit 0; }

          # Defence-in-depth: if the run reported associated PRs, the signalled PR must be
          # among them, so a tampered stage 1 cannot target an unrelated PR. (The App key is
          # never exposed regardless — this only bounds which PR can be drafted.)
          if [ "$(printf '%s' "$WR_PRS" | jq 'length')" -gt 0 ]; then
            if ! printf '%s' "$WR_PRS" | jq -e --argjson n "$PR" 'any(.[]; .number == $n)' >/dev/null 2>&1; then
              echo "::warning::Signalled PR #$PR is not associated with the triggering run — ignoring."
              exit 0
            fi
          fi

          PR_NODE=$(gh api "/repos/$REPO/pulls/$PR" --jq '.node_id')
          # shellcheck disable=SC2016  # $id is a GraphQL variable, not a shell var
          if gh api graphql -f query='mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{isDraft}}}' -f id="$PR_NODE" >/dev/null 2>&1; then
            echo "Converted PR #$PR to Draft (substantive Codex finding)."
          else
            echo "::warning::could not convert PR #$PR to Draft — left Ready for a human"
          fi

          gh pr comment "$PR" --repo "$REPO" --body "⏸️ Codex flagged a **P0/P1/P2** finding, so this PR was converted to **Draft** and handed back to its implementer (Status → Needs changes). Address the review comments above, then mark it **Ready for review** to re-trigger Codex. (P3-only nits leave a PR Ready.)" || true
