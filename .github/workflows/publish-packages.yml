name: Publish Packages

# Packs (and optionally publishes) the FairSpot open-core shared surfaces the future private
# fairspot-platform repo can consume: the FairSpot.SharedKernel NuGet package and the npm
# packages @robertvejvoda/fairspot-api-client and @robertvejvoda/fairspot-ui.
# Versioning and publish cadence are deliberate, not on every push. Bump <Version> in the
# csproj or the package.json version first.
#
# GitHub Packages publishing uses the built-in GITHUB_TOKEN for this public repo. Private
# consumers need their own read token configured in their CI npmrc.
on:
  pull_request:
    paths:
      - ".github/workflows/publish-packages.yml"
      - "code/clients/**"
      - "code/server/Shared/FPS.SharedKernel/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not push"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish-sharedkernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack FairSpot.SharedKernel
        run: dotnet pack code/server/Shared/FPS.SharedKernel/FPS.SharedKernel.csproj -c Release -o ${{ runner.temp }}/nupkg

      - name: Push to GitHub Packages
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: >-
          dotnet nuget push "${{ runner.temp }}/nupkg/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

  pack-and-publish-npm-packages:
    # Validates the shared npm package surfaces on PR and optionally publishes on manual dispatch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@robertvejvoda'

      - name: Pack @robertvejvoda/fairspot-api-client (dry run)
        run: npm pack --dry-run
        working-directory: code/clients/typescript

      - name: Publish @robertvejvoda/fairspot-api-client
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: npm publish
        working-directory: code/clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install @robertvejvoda/fairspot-ui build dependencies
        run: npm install --no-package-lock --ignore-scripts
        working-directory: code/clients/ui

      - name: Pack @robertvejvoda/fairspot-ui (dry run)
        run: npm pack --dry-run
        working-directory: code/clients/ui

      - name: Publish @robertvejvoda/fairspot-ui
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: npm publish
        working-directory: code/clients/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
