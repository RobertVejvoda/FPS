name: Delivery state orchestrator

# Reconciles GitHub Project fields (Status, Owner, Implementer) from issue and
# pull request events. This is the canonical state-machine for FPS Delivery Kanban.
# Labels are not used for assignment; Project fields are the durable workflow signals.
#
# Requires: PROJECT_SYNC_TOKEN repository secret with project write access.
# Falls back to github.token (read-only for user-owned projects) with a warning.

on:
  issues:
    types: [opened, closed]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: delivery-orchestrator-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: RobertVejvoda
  PROJECT_NUMBER: "2"
  PROJECT_ID: PVT_kwHOAMdNjM4ApbPD
  FIELD_STATUS: PVTSSF_lAHOAMdNjM4ApbPDzgg1is0
  FIELD_OWNER: PVTSSF_lAHOAMdNjM4ApbPDzhTZl4I
  FIELD_IMPLEMENTER: PVTSSF_lAHOAMdNjM4ApbPDzhTZl4E
  OPT_STATUS_BACKLOG: f75ad846
  OPT_STATUS_IN_REVIEW: 4cc61d42
  OPT_STATUS_NEEDS_CHANGES: 57f4a681
  OPT_STATUS_DONE: 98236657
  OPT_OWNER_CODEX: 7694f322
  OPT_OWNER_CLAUDE: 765bf827
  OPT_OWNER_COPILOT: 412d3a0c
  OPT_OWNER_ROBERT: c1a28914
  OPT_OWNER_NONE: a0ebe14c
  OPT_IMPL_CLAUDE: 907ea51b
  OPT_IMPL_COPILOT: b9bfc717

jobs:
  issue-opened-defaults:
    name: Default new issue — Backlog / Codex
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Set Status=Backlog Owner=Codex if not already set
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
          if [ -z "$ITEM_ID" ]; then
            echo "::warning::Could not add issue to project; board not updated"
            exit 0
          fi

          CURRENT_STATUS="$(gh api graphql \
            -f query='query($id:ID!){node(id:$id){...on ProjectV2Item{fieldValues(first:20){nodes{...on ProjectV2ItemFieldSingleSelectValue{name,field{...on ProjectV2SingleSelectField{name}}}}}}}}' \
            -f id="$ITEM_ID" \
            --jq '.data.node.fieldValues.nodes[] | select(.field.name == "Status") | .name // empty' \
            2>/dev/null || true)"

          if [ -n "$CURRENT_STATUS" ]; then
            echo "::notice::Issue already has Status=$CURRENT_STATUS; skipping defaults"
            exit 0
          fi

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_BACKLOG" \
            && echo "::notice::Issue Status -> Backlog" \
            || echo "::warning::Failed to set Status=Backlog"

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_CODEX" \
            && echo "::notice::Issue Owner -> Codex" \
            || echo "::warning::Failed to set Owner=Codex"

  issue-closed-done:
    name: Closed issue — Status=Done
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issues' &&
      github.event.action == 'closed' &&
      github.event.issue.pull_request == null
    steps:
      - name: Set Status=Done Owner=None
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
          if [ -z "$ITEM_ID" ]; then
            echo "::warning::Could not add/find issue in project; board not updated"
            exit 0
          fi

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_DONE" \
            && echo "::notice::Issue Status -> Done" \
            || echo "::warning::Failed to set Status=Done"

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_NONE" \
            && echo "::notice::Issue Owner -> None" \
            || echo "::warning::Failed to set Owner=None"

  pr-in-review:
    name: PR open/push — linked issues In review / Codex
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJson('["opened","synchronize","reopened"]'), github.event.action)
    steps:
      - name: Move linked issues to In review and set Implementer from attribution
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          REPO_OWNER="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          IMPL_OPTION=""
          IMPL_NAME="(not set)"
          if echo "$PR_LABELS_JSON" | jq -r '.[]' | grep -qx "implemented-by: claude"; then
            IMPL_OPTION="$OPT_IMPL_CLAUDE"
            IMPL_NAME="Claude"
          elif echo "$PR_LABELS_JSON" | jq -r '.[]' | grep -qx "implemented-by: copilot"; then
            IMPL_OPTION="$OPT_IMPL_COPILOT"
            IMPL_NAME="Copilot"
          fi

          LINKED_ISSUES="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
            2>/dev/null || true)"

          if [ -z "$LINKED_ISSUES" ]; then
            echo "::notice::PR #$PR_NUMBER has no linked closing issues; no board update"
            exit 0
          fi

          for ISSUE_NUM in $LINKED_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$ISSUE_NUM"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$ISSUE_NUM; skipping"
              continue
            fi

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_IN_REVIEW" \
              && echo "::notice::Issue #$ISSUE_NUM Status -> In review" \
              || echo "::warning::Failed to set Status for issue #$ISSUE_NUM"

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_CODEX" \
              && echo "::notice::Issue #$ISSUE_NUM Owner -> Codex" \
              || echo "::warning::Failed to set Owner for issue #$ISSUE_NUM"

            if [ -n "$IMPL_OPTION" ]; then
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
                --field-id "$FIELD_IMPLEMENTER" --single-select-option-id "$IMPL_OPTION" \
                && echo "::notice::Issue #$ISSUE_NUM Implementer -> $IMPL_NAME" \
                || echo "::warning::Failed to set Implementer for issue #$ISSUE_NUM"
            fi
          done

  pr-merged-done:
    name: PR merged — linked issues Done
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Set linked issues Status=Done Owner=None
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          REPO_OWNER="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          LINKED_ISSUES="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
            2>/dev/null || true)"

          if [ -z "$LINKED_ISSUES" ]; then
            echo "::notice::PR #$PR_NUMBER has no linked closing issues; no board update"
            exit 0
          fi

          for ISSUE_NUM in $LINKED_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$ISSUE_NUM"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$ISSUE_NUM; skipping"
              continue
            fi

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_DONE" \
              && echo "::notice::Issue #$ISSUE_NUM Status -> Done" \
              || echo "::warning::Failed to set Status for issue #$ISSUE_NUM"

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_NONE" \
              && echo "::notice::Issue #$ISSUE_NUM Owner -> None" \
              || echo "::warning::Failed to set Owner for issue #$ISSUE_NUM"
          done

  pr-review-changes-requested:
    name: Review changes requested — Needs changes / Owner=Implementer
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Set linked issues Status=Needs changes Owner=Implementer
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          REPO_OWNER="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          LINKED_ISSUES="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
            2>/dev/null || true)"

          if [ -z "$LINKED_ISSUES" ]; then
            echo "::notice::PR #$PR_NUMBER has no linked closing issues; no board update"
            exit 0
          fi

          for ISSUE_NUM in $LINKED_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$ISSUE_NUM"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$ISSUE_NUM; skipping"
              continue
            fi

            IMPLEMENTER_NAME="$(gh api graphql \
              -f query='query($id:ID!){node(id:$id){...on ProjectV2Item{fieldValues(first:20){nodes{...on ProjectV2ItemFieldSingleSelectValue{name,field{...on ProjectV2SingleSelectField{name}}}}}}}}' \
              -f id="$ITEM_ID" \
              --jq '.data.node.fieldValues.nodes[] | select(.field.name == "Implementer") | .name // empty' \
              2>/dev/null || true)"

            case "$IMPLEMENTER_NAME" in
              Claude)  OWNER_OPTION="$OPT_OWNER_CLAUDE" ;;
              Copilot) OWNER_OPTION="$OPT_OWNER_COPILOT" ;;
              Human)   OWNER_OPTION="$OPT_OWNER_ROBERT" ;;
              *)       OWNER_OPTION="$OPT_OWNER_NONE" ;;
            esac

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_NEEDS_CHANGES" \
              && echo "::notice::Issue #$ISSUE_NUM Status -> Needs changes" \
              || echo "::warning::Failed to set Status for issue #$ISSUE_NUM"

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_OWNER" --single-select-option-id "$OWNER_OPTION" \
              && echo "::notice::Issue #$ISSUE_NUM Owner -> ${IMPLEMENTER_NAME:-None}" \
              || echo "::warning::Failed to set Owner for issue #$ISSUE_NUM"
          done
