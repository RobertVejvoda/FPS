name: Delivery state orchestrator

# Reconciles GitHub Project fields (Status, Owner, Implementer) from issue and
# pull request events. This is the canonical state-machine for FPS Delivery Kanban.
# Labels are not used for assignment; Project fields are the durable workflow signals.
#
# Requires: PROJECT_SYNC_TOKEN repository secret with project write access.
# Falls back to github.token (read-only for user-owned projects) with a warning.

on:
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      route_target_issue:
        description: "Optional issue number for manual /fps-route test or repair"
        required: false
        type: string
      route_command:
        description: "Optional /fps-route command, such as codex-review, assign, blocked"
        required: false
        type: string
      route_owner:
        description: "Optional owner argument for assign/blocked, such as Claude, Copilot, Codex, Robert"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: delivery-orchestrator-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: RobertVejvoda
  PROJECT_NUMBER: "2"
  PROJECT_ID: PVT_kwHOAMdNjM4ApbPD
  FIELD_STATUS: PVTSSF_lAHOAMdNjM4ApbPDzgg1is0
  FIELD_OWNER: PVTSSF_lAHOAMdNjM4ApbPDzhTZl4I
  FIELD_IMPLEMENTER: PVTSSF_lAHOAMdNjM4ApbPDzhTZl4E
  OPT_STATUS_BACKLOG: f75ad846
  OPT_STATUS_ASSIGNED: 49905531
  OPT_STATUS_IN_REVIEW: 4cc61d42
  OPT_STATUS_NEEDS_CHANGES: 57f4a681
  OPT_STATUS_DONE: 98236657
  OPT_STATUS_BLOCKED: 12d8c996
  OPT_OWNER_CODEX: 7694f322
  OPT_OWNER_CLAUDE: 765bf827
  OPT_OWNER_COPILOT: 412d3a0c
  OPT_OWNER_ROBERT: c1a28914
  OPT_OWNER_NONE: a0ebe14c
  OPT_IMPL_CLAUDE: 907ea51b
  OPT_IMPL_COPILOT: b9bfc717
  OPT_IMPL_NONE: 571cc0a4

jobs:
  issue-opened-defaults:
    name: Default new issue — Backlog / Codex
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Set Status=Backlog Owner=Codex if not already set
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
          if [ -z "$ITEM_ID" ]; then
            echo "::warning::Could not add issue to project; board not updated"
            exit 0
          fi

          CURRENT_STATUS="$(gh api graphql \
            -f query='query($id:ID!){node(id:$id){...on ProjectV2Item{fieldValues(first:20){nodes{...on ProjectV2ItemFieldSingleSelectValue{name,field{...on ProjectV2SingleSelectField{name}}}}}}}}' \
            -f id="$ITEM_ID" \
            --jq '.data.node.fieldValues.nodes[] | select(.field.name == "Status") | .name // empty' \
            2>/dev/null || true)"

          if [ -n "$CURRENT_STATUS" ]; then
            echo "::notice::Issue already has Status=$CURRENT_STATUS; skipping defaults"
            exit 0
          fi

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_BACKLOG" \
            && echo "::notice::Issue Status -> Backlog" \
            || echo "::warning::Failed to set Status=Backlog"

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_CODEX" \
            && echo "::notice::Issue Owner -> Codex" \
            || echo "::warning::Failed to set Owner=Codex"

  issue-closed-done:
    name: Closed issue — Status=Done
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issues' &&
      github.event.action == 'closed' &&
      github.event.issue.pull_request == null
    steps:
      - name: Set Status=Done Owner=None
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
          if [ -z "$ITEM_ID" ]; then
            echo "::warning::Could not add/find issue in project; board not updated"
            exit 0
          fi

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_DONE" \
            && echo "::notice::Issue Status -> Done" \
            || echo "::warning::Failed to set Status=Done"

          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_NONE" \
            && echo "::notice::Issue Owner -> None" \
            || echo "::warning::Failed to set Owner=None"

  pr-in-review:
    name: PR open/push — linked issues In review / Codex
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJson('["opened","synchronize","reopened"]'), github.event.action)
    steps:
      - name: Move linked issues to In review and set Implementer from attribution
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          REPO_OWNER="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          IMPL_OPTION=""
          IMPL_NAME="(not set)"
          if echo "$PR_LABELS_JSON" | jq -r '.[]' | grep -qx "implemented-by: claude"; then
            IMPL_OPTION="$OPT_IMPL_CLAUDE"
            IMPL_NAME="Claude"
          elif echo "$PR_LABELS_JSON" | jq -r '.[]' | grep -qx "implemented-by: copilot"; then
            IMPL_OPTION="$OPT_IMPL_COPILOT"
            IMPL_NAME="Copilot"
          fi

          LINKED_ISSUES="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
            2>/dev/null || true)"

          if [ -z "$LINKED_ISSUES" ]; then
            echo "::notice::PR #$PR_NUMBER has no linked closing issues; no board update"
            exit 0
          fi

          for ISSUE_NUM in $LINKED_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$ISSUE_NUM"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$ISSUE_NUM; skipping"
              continue
            fi

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_IN_REVIEW" \
              && echo "::notice::Issue #$ISSUE_NUM Status -> In review" \
              || echo "::warning::Failed to set Status for issue #$ISSUE_NUM"

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_CODEX" \
              && echo "::notice::Issue #$ISSUE_NUM Owner -> Codex" \
              || echo "::warning::Failed to set Owner for issue #$ISSUE_NUM"

            if [ -n "$IMPL_OPTION" ]; then
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
                --field-id "$FIELD_IMPLEMENTER" --single-select-option-id "$IMPL_OPTION" \
                && echo "::notice::Issue #$ISSUE_NUM Implementer -> $IMPL_NAME" \
                || echo "::warning::Failed to set Implementer for issue #$ISSUE_NUM"
            fi
          done

  pr-merged-done:
    name: PR merged — linked issues Done
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Set linked issues Status=Done Owner=None
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          REPO_OWNER="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          LINKED_ISSUES="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
            2>/dev/null || true)"

          if [ -z "$LINKED_ISSUES" ]; then
            echo "::notice::PR #$PR_NUMBER has no linked closing issues; no board update"
            exit 0
          fi

          for ISSUE_NUM in $LINKED_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$ISSUE_NUM"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$ISSUE_NUM; skipping"
              continue
            fi

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_DONE" \
              && echo "::notice::Issue #$ISSUE_NUM Status -> Done" \
              || echo "::warning::Failed to set Status for issue #$ISSUE_NUM"

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_OWNER" --single-select-option-id "$OPT_OWNER_NONE" \
              && echo "::notice::Issue #$ISSUE_NUM Owner -> None" \
              || echo "::warning::Failed to set Owner for issue #$ISSUE_NUM"
          done

  pr-review-changes-requested:
    name: Review changes requested — Needs changes / Owner=Implementer
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Set linked issues Status=Needs changes Owner=Implementer
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          REPO_OWNER="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          LINKED_ISSUES="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
            -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
            2>/dev/null || true)"

          if [ -z "$LINKED_ISSUES" ]; then
            echo "::notice::PR #$PR_NUMBER has no linked closing issues; no board update"
            exit 0
          fi

          for ISSUE_NUM in $LINKED_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$ISSUE_NUM"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$ISSUE_NUM; skipping"
              continue
            fi

            IMPLEMENTER_NAME="$(gh api graphql \
              -f query='query($id:ID!){node(id:$id){...on ProjectV2Item{fieldValues(first:20){nodes{...on ProjectV2ItemFieldSingleSelectValue{name,field{...on ProjectV2SingleSelectField{name}}}}}}}}' \
              -f id="$ITEM_ID" \
              --jq '.data.node.fieldValues.nodes[] | select(.field.name == "Implementer") | .name // empty' \
              2>/dev/null || true)"

            case "$IMPLEMENTER_NAME" in
              Claude)  OWNER_OPTION="$OPT_OWNER_CLAUDE" ;;
              Copilot) OWNER_OPTION="$OPT_OWNER_COPILOT" ;;
              Human)   OWNER_OPTION="$OPT_OWNER_ROBERT" ;;
              *)       OWNER_OPTION="$OPT_OWNER_NONE" ;;
            esac

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$OPT_STATUS_NEEDS_CHANGES" \
              && echo "::notice::Issue #$ISSUE_NUM Status -> Needs changes" \
              || echo "::warning::Failed to set Status for issue #$ISSUE_NUM"

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_OWNER" --single-select-option-id "$OWNER_OPTION" \
              && echo "::notice::Issue #$ISSUE_NUM Owner -> ${IMPLEMENTER_NAME:-None}" \
              || echo "::warning::Failed to set Owner for issue #$ISSUE_NUM"

            if [ "$IMPLEMENTER_NAME" = "Claude" ]; then
              gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label "needs-claude-action" \
                && echo "::notice::PR #$PR_NUMBER labelled needs-claude-action for Claude handoff" \
                || echo "::warning::Failed to label PR #$PR_NUMBER"
            fi
          done

  pr-comment-state-command:
    name: PR comment /fps-state command
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/fps-state ')
    steps:
      - name: Apply state command to linked issues
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPO_OWNER: RobertVejvoda
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          # Only act for the repository owner
          if [ "$COMMENT_AUTHOR" != "$REPO_OWNER" ]; then
            echo "::notice::Ignoring /fps-state from non-owner $COMMENT_AUTHOR"
            exit 0
          fi

          # Parse: /fps-state <command> [<owner>]
          COMMAND="$(echo "$COMMENT_BODY" | awk '{print $2}' | head -1)"
          EXPLICIT_OWNER="$(echo "$COMMENT_BODY" | awk 'NR==1{print $3}' | head -1)"

          case "$COMMAND" in
            needs-changes)
              STATUS_OPT="$OPT_STATUS_NEEDS_CHANGES"
              STATUS_NAME="Needs changes"
              ;;
            in-review)
              STATUS_OPT="$OPT_STATUS_IN_REVIEW"
              STATUS_NAME="In review"
              [ -z "$EXPLICIT_OWNER" ] && EXPLICIT_OWNER="Codex"
              ;;
            done)
              STATUS_OPT="$OPT_STATUS_DONE"
              STATUS_NAME="Done"
              [ -z "$EXPLICIT_OWNER" ] && EXPLICIT_OWNER="None"
              ;;
            blocked)
              STATUS_OPT="$OPT_STATUS_BLOCKED"
              STATUS_NAME="Blocked"
              [ -z "$EXPLICIT_OWNER" ] && EXPLICIT_OWNER="Robert"
              ;;
            *)
              echo "::notice::Unknown /fps-state command: $COMMAND; supported: needs-changes, in-review, done, blocked"
              exit 0
              ;;
          esac

          REPO_OWNER_NAME="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          LINKED_ISSUES="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
            -f owner="$REPO_OWNER_NAME" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
            2>/dev/null || true)"

          if [ -z "$LINKED_ISSUES" ]; then
            echo "::notice::PR #$PR_NUMBER has no linked closing issues; no board update"
            exit 0
          fi

          for ISSUE_NUM in $LINKED_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$ISSUE_NUM"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$ISSUE_NUM; skipping"
              continue
            fi

            # Resolve owner option: explicit arg > Implementer field > None
            OWNER_OPTION=""
            OWNER_DISPLAY=""
            if [ -n "$EXPLICIT_OWNER" ]; then
              case "$EXPLICIT_OWNER" in
                Claude)        OWNER_OPTION="$OPT_OWNER_CLAUDE";   OWNER_DISPLAY="Claude" ;;
                Copilot)       OWNER_OPTION="$OPT_OWNER_COPILOT";  OWNER_DISPLAY="Copilot" ;;
                Codex)         OWNER_OPTION="$OPT_OWNER_CODEX";    OWNER_DISPLAY="Codex" ;;
                Robert|Human)  OWNER_OPTION="$OPT_OWNER_ROBERT";   OWNER_DISPLAY="Robert" ;;
                None)          OWNER_OPTION="$OPT_OWNER_NONE";     OWNER_DISPLAY="None" ;;
              esac
            fi

            if [ -z "$OWNER_OPTION" ] && [ "$COMMAND" = "needs-changes" ]; then
              IMPLEMENTER_NAME="$(gh api graphql \
                -f query='query($id:ID!){node(id:$id){...on ProjectV2Item{fieldValues(first:20){nodes{...on ProjectV2ItemFieldSingleSelectValue{name,field{...on ProjectV2SingleSelectField{name}}}}}}}}' \
                -f id="$ITEM_ID" \
                --jq '.data.node.fieldValues.nodes[] | select(.field.name == "Implementer") | .name // empty' \
                2>/dev/null || true)"
              case "$IMPLEMENTER_NAME" in
                Claude)  OWNER_OPTION="$OPT_OWNER_CLAUDE";  OWNER_DISPLAY="Claude" ;;
                Copilot) OWNER_OPTION="$OPT_OWNER_COPILOT"; OWNER_DISPLAY="Copilot" ;;
                Human)   OWNER_OPTION="$OPT_OWNER_ROBERT";  OWNER_DISPLAY="Robert" ;;
                *)       OWNER_OPTION="$OPT_OWNER_NONE";    OWNER_DISPLAY="None" ;;
              esac
            fi

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$STATUS_OPT" \
              && echo "::notice::Issue #$ISSUE_NUM Status -> $STATUS_NAME" \
              || echo "::warning::Failed to set Status for issue #$ISSUE_NUM"

            if [ -n "$OWNER_OPTION" ]; then
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
                --field-id "$FIELD_OWNER" --single-select-option-id "$OWNER_OPTION" \
                && echo "::notice::Issue #$ISSUE_NUM Owner -> $OWNER_DISPLAY" \
                || echo "::warning::Failed to set Owner for issue #$ISSUE_NUM"
            fi
          done

  route-comment-command:
    name: Issue or PR comment /fps-route command
    runs-on: ubuntu-latest
    if: >
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        startsWith(github.event.comment.body, '/fps-route ')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.route_target_issue != '' &&
        inputs.route_command != ''
      )
    steps:
      - name: Apply route command to target issues
        continue-on-error: true
        env:
          BOARD_PAT: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_PAT: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.route_target_issue }}
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          ROUTE_COMMAND_INPUT: ${{ inputs.route_command }}
          ROUTE_OWNER_INPUT: ${{ inputs.route_owner }}
          REPO_OWNER: RobertVejvoda
        run: |
          set -euo pipefail
          if [ -n "${BOARD_PAT:-}" ]; then
            export GH_TOKEN="$BOARD_PAT"
          else
            export GH_TOKEN="$FALLBACK_PAT"
            echo "::warning::PROJECT_SYNC_TOKEN not set; project writes may fail"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            COMMENT_BODY="/fps-route $ROUTE_COMMAND_INPUT ${ROUTE_OWNER_INPUT:-}"
            COMMENT_AUTHOR="$REPO_OWNER"
            COMMENT_ASSOCIATION="OWNER"
            IS_PR_COMMENT="false"
          fi

          # /fps-route is a lightweight reverse-handoff command. It may be used by
          # trusted humans and known agent bots, but it is intentionally less
          # authoritative than the owner-only /fps-state override.
          ALLOWED="false"
          case "$COMMENT_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              ALLOWED="true"
              ;;
          esac
          if [[ "$COMMENT_AUTHOR" == *"[bot]" ]] &&
             { [[ "$COMMENT_AUTHOR" == *copilot* ]] || [[ "$COMMENT_AUTHOR" == *claude* ]]; }; then
            ALLOWED="true"
          fi
          if [ "$ALLOWED" != "true" ]; then
            echo "::notice::Ignoring /fps-route from untrusted author $COMMENT_AUTHOR ($COMMENT_ASSOCIATION)"
            exit 0
          fi

          # Parse: /fps-route <command> [<owner>]
          COMMAND="$(echo "$COMMENT_BODY" | awk 'NR==1{print $2}' | head -1)"
          ARG_OWNER="$(echo "$COMMENT_BODY" | awk 'NR==1{print $3}' | head -1)"

          STATUS_OPT=""
          STATUS_NAME=""
          OWNER_OPTION=""
          OWNER_DISPLAY=""
          IMPL_OPTION=""
          IMPL_DISPLAY=""
          CLAUDE_INVOCATION_REQUIRED="false"

          set_owner() {
            case "$1" in
              Claude)  OWNER_OPTION="$OPT_OWNER_CLAUDE";  OWNER_DISPLAY="Claude" ;;
              Copilot) OWNER_OPTION="$OPT_OWNER_COPILOT"; OWNER_DISPLAY="Copilot" ;;
              Codex)   OWNER_OPTION="$OPT_OWNER_CODEX";   OWNER_DISPLAY="Codex" ;;
              Robert)  OWNER_OPTION="$OPT_OWNER_ROBERT";  OWNER_DISPLAY="Robert" ;;
              None)    OWNER_OPTION="$OPT_OWNER_NONE";    OWNER_DISPLAY="None" ;;
              *)
                echo "::notice::Unsupported route owner '$1'; supported: Claude, Copilot, Codex, Robert, None"
                exit 0
                ;;
            esac
          }

          set_implementer() {
            case "$1" in
              Claude)  IMPL_OPTION="$OPT_IMPL_CLAUDE";  IMPL_DISPLAY="Claude" ;;
              Copilot) IMPL_OPTION="$OPT_IMPL_COPILOT"; IMPL_DISPLAY="Copilot" ;;
              None)    IMPL_OPTION="$OPT_IMPL_NONE";    IMPL_DISPLAY="None" ;;
              *)
                echo "::notice::Unsupported route implementer '$1'; supported: Claude, Copilot, None"
                exit 0
                ;;
            esac
          }

          case "$COMMAND" in
            codex-review)
              STATUS_OPT="$OPT_STATUS_IN_REVIEW"
              STATUS_NAME="In review"
              set_owner Codex
              ;;
            claude-fix)
              STATUS_OPT="$OPT_STATUS_NEEDS_CHANGES"
              STATUS_NAME="Needs changes"
              set_owner Claude
              set_implementer Claude
              CLAUDE_INVOCATION_REQUIRED="true"
              ;;
            copilot-fix)
              STATUS_OPT="$OPT_STATUS_NEEDS_CHANGES"
              STATUS_NAME="Needs changes"
              set_owner Copilot
              set_implementer Copilot
              ;;
            claude-question)
              STATUS_OPT="$OPT_STATUS_BLOCKED"
              STATUS_NAME="Blocked"
              set_owner Codex
              set_implementer Claude
              ;;
            robert-decision)
              STATUS_OPT="$OPT_STATUS_BLOCKED"
              STATUS_NAME="Blocked"
              set_owner Robert
              ;;
            assign)
              STATUS_OPT="$OPT_STATUS_ASSIGNED"
              STATUS_NAME="Assigned"
              if [ -z "$ARG_OWNER" ]; then
                echo "::notice::Usage: /fps-route assign <Claude|Copilot|Codex|Robert>"
                exit 0
              fi
              set_owner "$ARG_OWNER"
              case "$ARG_OWNER" in
                Claude)
                  set_implementer "$ARG_OWNER"
                  CLAUDE_INVOCATION_REQUIRED="true"
                  ;;
                Copilot) set_implementer "$ARG_OWNER" ;;
              esac
              ;;
            blocked)
              STATUS_OPT="$OPT_STATUS_BLOCKED"
              STATUS_NAME="Blocked"
              [ -z "$ARG_OWNER" ] && ARG_OWNER="Robert"
              set_owner "$ARG_OWNER"
              ;;
            *)
              echo "::notice::Unknown /fps-route command: $COMMAND; supported: codex-review, claude-fix, copilot-fix, claude-question, robert-decision, assign, blocked"
              exit 0
              ;;
          esac

          REPO_OWNER_NAME="${GH_REPO%%/*}"
          REPO_NAME="${GH_REPO##*/}"

          if [ "$IS_PR_COMMENT" = "true" ]; then
            TARGET_ISSUES="$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:10){nodes{number}}}}}' \
              -f owner="$REPO_OWNER_NAME" -f repo="$REPO_NAME" -F pr="$ISSUE_NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
              2>/dev/null || true)"
          else
            TARGET_ISSUES="$ISSUE_NUMBER"
          fi

          if [ -z "$TARGET_ISSUES" ]; then
            echo "::notice::No target issues found for /fps-route $COMMAND"
            exit 0
          fi

          for TARGET_ISSUE in $TARGET_ISSUES; do
            ISSUE_URL="https://github.com/$GH_REPO/issues/$TARGET_ISSUE"
            ITEM_ID="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)"
            if [ -z "$ITEM_ID" ]; then
              echo "::warning::Could not get project item for issue #$TARGET_ISSUE; skipping"
              continue
            fi

            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_STATUS" --single-select-option-id "$STATUS_OPT" \
              && echo "::notice::Issue #$TARGET_ISSUE Status -> $STATUS_NAME" \
              || echo "::warning::Failed to set Status for issue #$TARGET_ISSUE"

            if [ -n "$OWNER_OPTION" ]; then
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
                --field-id "$FIELD_OWNER" --single-select-option-id "$OWNER_OPTION" \
                && echo "::notice::Issue #$TARGET_ISSUE Owner -> $OWNER_DISPLAY" \
                || echo "::warning::Failed to set Owner for issue #$TARGET_ISSUE"
            fi

            if [ -n "$IMPL_OPTION" ]; then
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
                --field-id "$FIELD_IMPLEMENTER" --single-select-option-id "$IMPL_OPTION" \
                && echo "::notice::Issue #$TARGET_ISSUE Implementer -> $IMPL_DISPLAY" \
                || echo "::warning::Failed to set Implementer for issue #$TARGET_ISSUE"
            fi

            if [ "$CLAUDE_INVOCATION_REQUIRED" = "true" ]; then
              gh issue edit "$TARGET_ISSUE" --repo "$GH_REPO" --add-assignee "$REPO_OWNER" \
                && echo "::notice::Issue #$TARGET_ISSUE assigned to $REPO_OWNER for Claude UI invocation" \
                || echo "::warning::Failed to assign issue #$TARGET_ISSUE to $REPO_OWNER"

              gh issue comment "$TARGET_ISSUE" --repo "$GH_REPO" \
                --body "Claude route prepared. GitHub assignee @$REPO_OWNER is notification-only so Robert can invoke or reassign Claude through the GitHub UI. Durable owner remains Claude in the FPS Delivery Kanban." \
                && echo "::notice::Issue #$TARGET_ISSUE Claude invocation note posted" \
                || echo "::warning::Failed to post Claude invocation note for issue #$TARGET_ISSUE"
            fi
          done
