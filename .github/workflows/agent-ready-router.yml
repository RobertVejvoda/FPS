name: Agent ready router

on:
  issues:
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, reopened, closed]
  pull_request_target:
    types: [labeled, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: agent-ready-router-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync-issue-board-fields:
    name: Sync issue board fields
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issues' &&
      github.event.issue.pull_request == null
    steps:
      - name: Best-effort Project field sync
        continue-on-error: true
        env:
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ github.token }}
          ISSUE_LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          GH_REPO: ${{ github.repository }}
          HUMAN_OWNER: RobertVejvoda
          PROJECT_OWNER: RobertVejvoda
          PROJECT_NUMBER: "2"
        run: |
          set -euo pipefail

          if [ -n "${PROJECT_SYNC_TOKEN:-}" ]; then
            export GH_TOKEN="$PROJECT_SYNC_TOKEN"
          else
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
          fi

          labels="$(jq -r '.[]' <<< "$ISSUE_LABELS_JSON" | tr '\n' ' ')"
          title_upper="$(tr '[:lower:]' '[:upper:]' <<< "$ISSUE_TITLE")"

          status=""
          if grep -qw "blocked-question" <<< "$labels"; then
            status="Backlog"
          elif grep -qw "needs-codex-review" <<< "$labels"; then
            status="In review"
          fi

          phase=""
          case "$title_upper" in
            B[0-9][0-9][0-9]*|*"("B[0-9][0-9][0-9]*")"*)
              phase="Booking"
              ;;
            BK[0-9][0-9][0-9]*|A[0-9][0-9][0-9]*|CFG[0-9][0-9][0-9]*|CUST[0-9][0-9][0-9]*|ID[0-9][0-9][0-9]*|N[0-9][0-9][0-9]*|P[0-9][0-9][0-9]*|REPORT[0-9][0-9][0-9]*|*"("A[0-9][0-9][0-9]*")"*|*"("CFG[0-9][0-9][0-9]*")"*|*"("N[0-9][0-9][0-9]*")"*|*"("P[0-9][0-9][0-9]*")"*|*"("REPORT[0-9][0-9][0-9]*")"*)
              phase="Platform"
              ;;
            MOB[0-9][0-9][0-9]*)
              phase="Mobile"
              ;;
            WEB[0-9][0-9][0-9]*)
              phase="Web"
              ;;
            OPS[0-9][0-9][0-9]*)
              phase="Operations"
              ;;
            DOCS001*)
              phase="Demo"
              ;;
            BILL[0-9][0-9][0-9]*)
              phase="Commercialisation"
              ;;
            CI[0-9][0-9][0-9]*|DOCS:*)
              phase="Foundation"
              ;;
          esac

          if [ -z "$status" ] && [ -z "$phase" ]; then
            echo "No board fields to sync"
            exit 0
          fi

          project_json="$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          project_id="$(jq -r '.id' <<< "$project_json")"
          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json)"
          item_id="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL" --format json --jq .id)"

          if [ -n "$phase" ]; then
            phase_field_id="$(jq -r '.fields[] | select(.name == "Phase") | .id' <<< "$fields_json")"
            phase_option_id="$(
              jq -r --arg phase "$phase" \
                '.fields[] | select(.name == "Phase") | .options[] | select(.name == $phase) | .id' \
                <<< "$fields_json"
            )"

            gh project item-edit \
              --project-id "$project_id" \
              --id "$item_id" \
              --field-id "$phase_field_id" \
              --single-select-option-id "$phase_option_id"

            echo "Synced issue board phase to $phase"
          fi

          if [ -n "$status" ]; then
            status_field_id="$(jq -r '.fields[] | select(.name == "Status") | .id' <<< "$fields_json")"
            status_option_id="$(
              jq -r --arg status "$status" \
                '.fields[] | select(.name == "Status") | .options[] | select(.name == $status) | .id' \
                <<< "$fields_json"
            )"

            gh project item-edit \
              --project-id "$project_id" \
              --id "$item_id" \
              --field-id "$status_field_id" \
              --single-select-option-id "$status_option_id"

            echo "Synced issue board status to $status"
          else
            echo "No exceptional board status to sync"
          fi

          if grep -qw "blocked-question" <<< "$labels" ||
             grep -qw "needs-codex-review" <<< "$labels"; then
            GH_TOKEN="$FALLBACK_GH_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" \
              --add-assignee "$HUMAN_OWNER"

            echo "Assigned issue to $HUMAN_OWNER for human/Codex action"
          fi

  sync-pr-human-handoff:
    name: Sync pull request human handoff
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        contains(github.event.pull_request.labels.*.name, 'blocked-question') ||
        contains(github.event.pull_request.labels.*.name, 'needs-codex-review')
      )
    steps:
      - name: Assign PR to human owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HUMAN_OWNER: RobertVejvoda
        run: |
          set -euo pipefail

          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" \
            --add-assignee "$HUMAN_OWNER"

          echo "Assigned PR to $HUMAN_OWNER for human/Codex action"

  route-claude-issue:
    name: Prepare Claude issue handoff
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issues' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'needs-claude-action') &&
      !contains(github.event.issue.labels.*.name, 'blocked-question')
    steps:
      - name: Post Claude issue handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          handoff_file="$RUNNER_TEMP/claude-issue-handoff.md"
          issue_json="$RUNNER_TEMP/claude-issue-context.json"

          gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --json title,url,body,labels,comments \
            > "$issue_json"

          {
            cat <<'HANDOFF'
          Automated Claude handoff prepared. No Anthropic API call was made.

          Use this prompt only when a human decides the task is worth spending Claude tokens.
          After this comment is posted, the router removes needs-claude-action.
          Assign the Claude agent through the GitHub Web UI when ready to start implementation.

          ```text
          You are Claude acting as FPS Implementer.

          Follow AGENTS.md exactly. Keep scope narrow. Do not implement adjacent slices.
          If blocked, comment with the concrete blocker instead of widening scope.
          When finished, open or update a focused PR, report validation, and add needs-codex-review.

          HANDOFF

            jq -r '
              "## Issue\n" +
              "Title: \(.title)\n" +
              "URL: \(.url)\n" +
              "Labels: \([.labels[].name] | join(", "))\n\n" +
              "## Body\n" +
              ((.body // "") | if . == "" then "(empty)" else . end) + "\n\n" +
              "## Conversation Comments\n" +
              ((.comments // [])
                | map(select((.author.login != "github-actions") or (((.body // "") | startswith("Automated Claude handoff prepared.")) | not)))
                | map("### " + .author.login + " at " + .createdAt + "\n" + .body)
                | join("\n\n"))
            ' "$issue_json"

            printf '\n```\n'
          } > "$handoff_file"

          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file "$handoff_file"
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" \
            --remove-label needs-claude-action

  route-claude-pr:
    name: Prepare Claude pull request handoff
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'needs-claude-action')
    steps:
      - name: Post Claude PR handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          handoff_file="$RUNNER_TEMP/claude-pr-handoff.md"
          pr_json="$RUNNER_TEMP/claude-pr-context.json"
          review_comments_json="$RUNNER_TEMP/claude-pr-review-comments.json"

          gh pr view "$PR_NUMBER" --repo "$GH_REPO" \
            --json title,url,body,headRefName,baseRefName,labels,comments,reviews,files \
            > "$pr_json"

          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" > "$review_comments_json"

          {
            cat <<'HANDOFF'
          Automated Claude handoff prepared. No Anthropic API call was made.

          Use this prompt only when a human decides the PR repair is worth spending Claude tokens.
          After this comment is posted, the router removes needs-claude-action.
          Assignment and project Status are the durable ownership signals.

          ```text
          You are Claude acting as FPS Implementer.

          Follow AGENTS.md exactly.
          The PR context below is complete enough to act; do not call gh to rediscover PR comments, labels, or review state.
          Address Codex review feedback on this PR only. Keep the existing PR scope.
          Do not start a parallel implementation or unrelated refactor.
          Start by editing the changed files listed below. Use local search only when needed to understand nearby types or examples.
          For validation, run the command requested by Codex review; otherwise prefer ./tools/validate.sh for code changes.
          When finished, push updates to this PR branch if permitted, report validation, and add needs-codex-review.

          HANDOFF

            jq -r '
              "## Pull Request\n" +
              "Title: \(.title)\n" +
              "URL: \(.url)\n" +
              "Head: \(.headRefName)\n" +
              "Base: \(.baseRefName)\n" +
              "Labels: \([.labels[].name] | join(", "))\n\n" +
              "## PR Body\n" +
              ((.body // "") | if . == "" then "(empty)" else . end) + "\n\n" +
              "## Changed Files\n" +
              ((.files // []) | map("- " + .path) | join("\n")) + "\n\n" +
              "## Conversation Comments\n" +
              ((.comments // [])
                | map(select((.author.login != "github-actions") or (((.body // "") | startswith("Automated Claude handoff prepared.")) | not)))
                | map("### " + .author.login + " at " + .createdAt + "\n" + .body)
                | join("\n\n")) + "\n\n" +
              "## Reviews\n" +
              ((.reviews // []) | map("### " + .author.login + " " + .state + " at " + (.submittedAt // "") + "\n" + (.body // "")) | join("\n\n"))
            ' "$pr_json"

            printf '\n\n## Inline Review Comments\n'
            jq -r '
              if length == 0 then
                "(none)"
              else
                map("### " + .user.login + " on " + .path + ":" + ((.line // .original_line // 0) | tostring) + "\n" + .body) | join("\n\n")
              end
            ' "$review_comments_json"

            printf '\n```\n'
          } > "$handoff_file"

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$handoff_file"
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" \
            --remove-label needs-claude-action
