# nginx config for the FairSpot web SPA.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is generated per-deploy; never cache it.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths serve index.html so client-side
    # routing (react-router) works on deep links and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
