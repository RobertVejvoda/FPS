# nginx config for the FairSpot web SPA.
#
# Single public hostname model: app.<domain> -> this container.
#   - "/"      serves the SPA (client-side routing falls back to index.html)
#   - "/api/"  is reverse-proxied to the Envoy API gateway (same origin → no CORS)
#
# The SPA's runtime apiBaseUrl must therefore be ".../api" (e.g.
# https://app.<domain>/api). SPA routes live at "/" and never collide with the
# "/api/" prefix used for backend calls.
#
# Security response headers are declared at the server level (inherited by the
# "/" and "/api/" locations, which set no add_header of their own) and repeated
# in the locations that do set add_header — nginx replaces, not merges, inherited
# add_header directives when a location declares its own.
#
# Note: the Content-Security-Policy here is the safe, non-breaking subset
# (frame-ancestors + base-uri). A full resource-level CSP (script-src/style-src/
# connect-src) needs the configured public + auth domains and live validation of
# the OIDC flow, so it is intentionally a follow-up (#628), not bundled here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security response headers (applied to "/" and "/api/") ──────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;

    # Reverse-proxy API calls to the Envoy gateway. Use the Docker DNS resolver
    # and a variable upstream so nginx starts even if Envoy is not up yet.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $fps_gateway envoy-proxy;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$fps_gateway:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }

    # Runtime config is generated per-deploy; never cache it.
    location = /config.json {
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths serve index.html so client-side
    # routing (react-router) works on deep links and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
