name: Booking Service Tests

on:
  push:
    paths:
      - 'code/server/Booking/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'code/server/Booking/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore code/server/Booking/FPS.Booking.sln
      - name: Build
        run: dotnet build code/server/Booking/FPS.Booking.sln --no-restore
      - name: Test
        run: dotnet test code/server/Booking/FPS.Booking.Tests/FPS.Booking.Tests.csproj --no-build
