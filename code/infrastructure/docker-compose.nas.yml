# NAS deployment overlay — adds restart policies and enforces required secrets.
#
# Usage (infra-only stack):
#   docker compose \
#     --env-file nas.env \
#     -f docker-compose.yaml \
#     -f docker-compose.nas.yml \
#     up -d
#
# With service containers + Dapr (full stack):
#   docker compose \
#     --env-file nas.env \
#     -f docker-compose.yaml \
#     -f docker-compose.services.yml \
#     -f docker-compose.dapr.yml \
#     -f docker-compose.nas.yml \
#     up -d
#
# Prerequisites:
#   Copy code/infrastructure/nas.env.example to code/infrastructure/nas.env
#   and fill in all required values before first run.
#   The nas.env file is gitignored and must never be committed.
#
# This overlay is NAS/hosted-only. Do not apply it to local development.
# The default docker-compose.yaml has no restart policy so containers do not
# auto-start on developer machine reboots.

services:

  fps-audit:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-booking:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-configuration:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-customer:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-datahub:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-identity:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-notification:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-profile:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-reporting:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in nas.env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in nas.env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  envoy-proxy:
    restart: unless-stopped

  # Vault: restart + enforce non-default token.
  # The :? syntax causes Docker Compose to abort with an error if the variable
  # is unset or empty, preventing startup with the dev-only-token default.
  # Durable Vault server mode (not -dev). Starts sealed/uninitialized on a clean
  # volume; the operator performs a one-time init/unseal/enable-kv and provisions
  # VAULT_TOKEN (see the NAS runbook), then unseals after each restart.
  #
  # VAULT_TOKEN is intentionally NOT enforced here: on first boot no token exists
  # yet, so gating compose startup on it would block the very run that brings
  # Vault up to be initialized. The token is consumed by vault-init and the Dapr
  # sidecars; a wrong/dev token fails closed (it cannot read secrets from the real
  # server-mode Vault).
  vault:
    restart: unless-stopped
    command: server -config=/vault/config/vault.hcl
    environment:
      # In-container CLI target for the operator's `vault operator unseal`/init.
      - VAULT_ADDR=http://127.0.0.1:8200
    volumes:
      - ./vault/config:/vault/config:ro

  minio:
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in nas.env}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in nas.env}

  # Dedicated PostgreSQL for Keycloak (separate from the DataHub Postgres) so identity
  # state has its own durable volume and clean backup/restore boundary. Loopback-only.
  keycloak-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${KC_DB_USER:?Set KC_DB_USER in nas.env}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in nas.env}
      - POSTGRES_DB=${KC_DB_NAME:-keycloak}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak} -d ${KC_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Production Keycloak: real `start` (not dev/H2), Postgres-backed durable identity,
  # TLS terminated at Cloudflare (KC_HTTP_ENABLED + forwarded proxy headers), and an
  # operator-supplied realm import (drop a `kc.sh export` under keycloak/import/).
  keycloak:
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USER:?Set KC_ADMIN_USER in nas.env}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASS:?Set KC_ADMIN_PASS in nas.env}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/${KC_DB_NAME:-keycloak}
      - KC_DB_USERNAME=${KC_DB_USER:?Set KC_DB_USER in nas.env}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in nas.env}
      # Behind Cloudflare: origin speaks HTTP, TLS/hostname come from the edge.
      - KC_HOSTNAME=${KC_HOSTNAME:?Set KC_HOSTNAME in nas.env, e.g. https://auth.example.net}
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HEALTH_ENABLED=true
    volumes:
      # Operator-supplied realm export(s); the directory contents are git-ignored.
      - ./keycloak/import:/opt/keycloak/data/import:ro

  rabbitmq:
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?Set RABBITMQ_USER in nas.env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?Set RABBITMQ_PASS in nas.env}

  # Interim: enforce a non-default Postgres credential, consistent with the other
  # datastores. Target architecture is to source all datastore credentials from
  # Vault so only the Vault password lives in nas.env — see security backlog #628.
  postgres:
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in nas.env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in nas.env}
      - POSTGRES_DB=${POSTGRES_DB:-fps_datahub}

  mongodb:
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?Set MONGO_USER in nas.env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:?Set MONGO_PASS in nas.env}

  jaeger:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  alertmanager:
    restart: unless-stopped
    volumes:
      - ./alertmanager/runtime/secrets:/etc/alertmanager/secrets:ro

  loki:
    restart: unless-stopped

  promtail:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in nas.env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in nas.env}

  zipkin:
    restart: unless-stopped

  # vault-init is defined only in docker-compose.dapr.yml and must not be overridden
  # here — doing so creates a phantom service with no image when the Dapr file is
  # absent, failing compose validation. vault-init inherits VAULT_TOKEN and
  # credential env vars from the host environment, which are already enforced
  # above by the vault/mongodb/rabbitmq/minio service overrides.
