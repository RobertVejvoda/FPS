# NAS deployment overlay — adds restart policies and enforces required secrets.
#
# Usage (infra-only stack):
#   docker compose \
#     --env-file .env \
#     -f docker-compose.yaml \
#     -f docker-compose.nas.yml \
#     up -d
#
# With service containers + Dapr (full stack):
#   docker compose \
#     --env-file .env \
#     -f docker-compose.yaml \
#     -f docker-compose.services.yml \
#     -f docker-compose.dapr.yml \
#     -f docker-compose.nas.yml \
#     up -d
#
# Prerequisites:
#   Copy code/infrastructure/.env.example to code/infrastructure/.env
#   and fill in all required values before first run.
#   The .env file is gitignored and must never be committed.
#
# This overlay is NAS/hosted-only. Do not apply it to local development.
# The default docker-compose.yaml has no restart policy so containers do not
# auto-start on developer machine reboots.

services:

  fps-audit:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-booking:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-configuration:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-customer:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-datahub:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-identity:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-notification:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-profile:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  fps-reporting:
    environment:
      Auth__Authority: ${FPS_AUTH_AUTHORITY:?Set FPS_AUTH_AUTHORITY in .env}
      Auth__Audience: ${FPS_AUTH_AUDIENCE:?Set FPS_AUTH_AUDIENCE in .env}
      Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-}
      Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-false}
      Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-false}

  envoy-proxy:
    restart: unless-stopped

  # Vault: restart + enforce non-default token.
  # The :? syntax causes Docker Compose to abort with an error if the variable
  # is unset or empty, preventing startup with the dev-only-token default.
  vault:
    restart: unless-stopped
    command: >
      server -dev
      -dev-root-token-id=${VAULT_TOKEN:?Set VAULT_TOKEN in .env (never use dev-only-token on NAS)}
      -dev-listen-address=0.0.0.0:8200

  minio:
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}

  keycloak:
    restart: unless-stopped
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USER:?Set KC_ADMIN_USER in .env}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASS:?Set KC_ADMIN_PASS in .env}

  rabbitmq:
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}

  postgres:
    restart: unless-stopped

  mongodb:
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?Set MONGO_USER in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:?Set MONGO_PASS in .env}

  jaeger:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  alertmanager:
    restart: unless-stopped

  loki:
    restart: unless-stopped

  promtail:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}

  zipkin:
    restart: unless-stopped

  # vault-init is defined only in docker-compose.dapr.yml and must not be overridden
  # here — doing so creates a phantom service with no image when the Dapr file is
  # absent, failing compose validation. vault-init inherits VAULT_TOKEN and
  # credential env vars from the host environment, which are already enforced
  # above by the vault/mongodb/rabbitmq/minio service overrides.
