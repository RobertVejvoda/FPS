# OPS017 — Dapr service-to-service security for the FairSpot-operated CLOUD/K8s profile.
#
# This is the mTLS-ENABLED target configuration for the planned Kubernetes hosting
# profile (DigitalOcean DOKS). It is a template/target artifact — it is NOT mounted by
# the local or NAS Docker Compose stack, which run mTLS-disabled by documented exception
# (see fps-config.yaml and docs/production/dapr-first-production-standards.md, OPS017).
#
# Why this lives on Kubernetes and not Compose:
#   Dapr mTLS needs the Dapr control plane's Sentry service to issue and rotate the
#   workload certificates that give each sidecar its SPIFFE identity. Sentry is standard
#   on the Kubernetes Dapr install (and managed Dapr runtimes) but is not present in the
#   self-hosted Docker Compose stack, which runs only Placement + Scheduler. Rather than
#   bolt Sentry onto Compose, mTLS is delivered by the K8s move where it is the default.
#
# Trust anchors and rotation (operator-owned; NO key material is committed here):
#   - Sentry holds the trust-bundle root CA and issues per-workload leaf certs bound to
#     the app SPIFFE ID (spiffe://<trust-domain>/ns/<namespace>/<app-id>).
#   - `workloadCertTTL` sets the leaf lifetime; Sentry auto-rotates before expiry.
#   - `allowedClockSkew` tolerates node clock drift during verification.
#   - Rotate the root by rolling the Sentry trust bundle secret and restarting sidecars;
#     record rotation evidence in the operator runbook (private fairspot-platform repo).
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-configuration
spec:
  actors:
    actorStateStore: workflowstore
  tracing:
    samplingRate: "1"
    # Hosted: export to the OpenTelemetry Collector, not the local Zipkin endpoint.
    otel:
      endpointAddress: "otel-collector:4317"
      isSecure: false
      protocol: grpc
  mtls:
    # Enabled on the K8s/DOKS profile: all sidecar-to-sidecar traffic is encrypted and
    # mutually authenticated via Sentry-issued SPIFFE identities.
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
    # Workflow history signing may be enabled on this profile because mTLS is on and the
    # CA/root-key lifecycle is documented and rotated by Sentry. Turn it on deliberately,
    # together with the operator evidence for the trust-bundle lifecycle.
    # workflowHistorySigning:
    #   enabled: true
