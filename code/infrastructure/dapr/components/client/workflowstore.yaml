# Client-owned production — substitute with client-approved workflow-capable state store.
# This store is used by the Dapr actor runtime behind Dapr Workflow.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflowstore
spec:
  type: state.mongodb           # Replace type and metadata for client store
  version: v1
  metadata:
  - name: host
    secretKeyRef:
      name: mongodb-connection
      key: host
  - name: databaseName
    value: fps-workflow
  - name: collectionName
    value: workflows
  - name: username
    secretKeyRef:
      name: mongodb-connection
      key: username
  - name: password
    secretKeyRef:
      name: mongodb-connection
      key: password
  - name: actorStateStore
    value: "true"
auth:
  secretStore: secretstore
