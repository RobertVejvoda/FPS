apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: fairspot-pubsub
scopes:
- fairspot-booking
- fairspot-notification
- fairspot-audit
- fairspot-customer
- fairspot-reporting
- fairspot-datahub
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
  - name: protocol
    value: amqp
  - name: hostname
    value: localhost
  - name: durable
    value: "true"
  - name: deletedWhenUnused
    value: "false"
  - name: prefetchCount
    value: "10"
  - name: reconnectWait
    value: "5s"
  - name: enableTLS
    value: "false"
  - name: deliveryMode
    value: "2"
  - name: username
    secretKeyRef:
      name: rabbitmq-credentials
      key: username
  - name: password
    secretKeyRef:
      name: rabbitmq-credentials
      key: password
auth:
  secretStore: secretstore
