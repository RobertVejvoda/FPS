apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: reportingstore
spec:
  type: state.mongodb
  version: v1
  metadata:
  - name: host
    value: localhost:27017
  - name: databaseName
    value: fairspot-reporting
  - name: collectionName
    value: projections
  - name: username
    secretKeyRef:
      name: mongodb-credentials
      key: username
  - name: password
    secretKeyRef:
      name: mongodb-credentials
      key: password
  - name: authSource
    value: admin
  - name: params
    value: "?authSource=admin&ssl=false"
scopes:
- fairspot-reporting
auth:
  secretStore: secretstore
