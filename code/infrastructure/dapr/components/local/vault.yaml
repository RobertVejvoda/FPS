apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
  - name: vaultAddr
    value: http://localhost:8200
  - name: skipVerify
    value : "true"
  - name: vaultToken
    value : "dev-only-token"
  - name: vaultKVPrefix
    value : "dapr"
  - name: vaultKVUsePrefix
    value: "true"
  - name: enginePath
    value: "secret"
  - name: vaultValueType
    value: "map"
  # Local dev only. Demo and client profiles must use workload identity or a
  # CI-injected token — never a committed credential.