apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: deactivatedstore
spec:
  type: state.mongodb
  version: v1
  metadata:
  - name: host
    value: mongodb:27017
  - name: databaseName
    value: fairspot-shared
  - name: collectionName
    value: deactivated-users
  - name: username
    secretKeyRef:
      name: mongodb-credentials
      key: username
  - name: password
    secretKeyRef:
      name: mongodb-credentials
      key: password
  - name: authSource
    value: admin
  - name: params
    value: "?authSource=admin&ssl=false"
# No scopes — all fps-* services read and write deactivated-user state.
auth:
  secretStore: secretstore
