apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
  - name: vaultAddr
    value: http://vault:8200
  - name: skipVerify
    value : "true"
  - name: vaultToken
    value : "{env:VAULT_TOKEN}"
  - name: vaultKVPrefix
    value : "dapr"
  - name: vaultKVUsePrefix
    value: "true"
  - name: enginePath
    value: "secret"
  - name: vaultValueType
    value: "map"
  # VAULT_TOKEN is injected at runtime via docker-compose.dapr.yml (env var).
  # Local-container default: dev-only-token. NAS/production: set VAULT_TOKEN
  # in the host environment; the token must never be committed in source control.