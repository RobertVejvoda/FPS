apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
  - name: vaultAddr
    value: http://vault:8200
  - name: skipVerify
    value : "true"
  - name: vaultTokenMountPath
    value : "/run/secrets/vault_token"
  - name: vaultKVPrefix
    value : "dapr"
  - name: vaultKVUsePrefix
    value: "true"
  - name: enginePath
    value: "secret"
  - name: vaultValueType
    value: "map"
  # VAULT_TOKEN is mounted at runtime via the docker-compose.dapr.yml
  # vault_token secret. Local-container default: dev-only-token. NAS/production:
  # set VAULT_TOKEN in the env file; the token must never be committed in source
  # control.
