apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: customerstore
spec:
  type: state.mongodb
  version: v1
  metadata:
  - name: host
    value: mongodb:27017
  - name: databaseName
    value: fps-customer
  - name: collectionName
    value: tenants
  - name: username
    secretKeyRef:
      name: mongodb-credentials
      key: username
  - name: password
    secretKeyRef:
      name: mongodb-credentials
      key: password
  - name: authSource
    value: admin
  - name: params
    value: "?authSource=admin&ssl=false"
scopes:
- fps-customer
auth:
  secretStore: secretstore
