# Demo profile — MongoDB-compatible managed workflow state store.
# Used by Dapr Workflow actor runtime, separate from service-owned business state.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflowstore
spec:
  type: state.mongodb
  version: v1
  metadata:
  - name: host
    secretKeyRef:
      name: mongodb-connection
      key: host
  - name: databaseName
    value: fairspot-workflow
  - name: collectionName
    value: workflows
  - name: username
    secretKeyRef:
      name: mongodb-connection
      key: username
  - name: password
    secretKeyRef:
      name: mongodb-connection
      key: password
  - name: params
    value: "?ssl=true&replicaSet=atlas-xxx"
  - name: actorStateStore
    value: "true"
auth:
  secretStore: secretstore
