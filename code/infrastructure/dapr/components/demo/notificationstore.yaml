# Demo profile — MongoDB-compatible managed store.
# Replace host with a managed MongoDB Atlas connection string or equivalent.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: notificationstore
spec:
  type: state.mongodb
  version: v1
  metadata:
  - name: host
    secretKeyRef:
      name: mongodb-connection
      key: host
  - name: databaseName
    value: fairspot-notification
  - name: collectionName
    value: notifications
  - name: username
    secretKeyRef:
      name: mongodb-connection
      key: username
  - name: password
    secretKeyRef:
      name: mongodb-connection
      key: password
  - name: params
    value: "?ssl=true&replicaSet=atlas-xxx"
scopes:
- fairspot-notification
auth:
  secretStore: secretstore
