# Demo profile — MongoDB-compatible managed store.
# Replace host with a managed MongoDB Atlas connection string or equivalent.
# Use collection-per-tenant provisioning: {tenantId}_tenants.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: customerstore
spec:
  type: state.mongodb
  version: v1
  metadata:
  - name: host
    secretKeyRef:
      name: mongodb-connection
      key: host
  - name: databaseName
    value: fps-customer
  - name: collectionName
    value: tenants
  - name: username
    secretKeyRef:
      name: mongodb-connection
      key: username
  - name: password
    secretKeyRef:
      name: mongodb-connection
      key: password
  - name: params
    value: "?ssl=true&replicaSet=atlas-xxx"
scopes:
- fps-customer
auth:
  secretStore: secretstore
