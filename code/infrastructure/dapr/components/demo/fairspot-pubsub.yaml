# Demo profile — replace RabbitMQ with a managed broker.
# Azure Service Bus example (swap the spec block; component name stays fairspot-pubsub):
#
# spec:
#   type: pubsub.azure.servicebus.topics
#   version: v1
#   metadata:
#   - name: namespaceName
#     value: "fairspot-demo.servicebus.windows.net"
#   - name: azureClientId          # user-assigned managed identity
#     value: "{env:AZURE_CLIENT_ID}"
#
# Scope each component to the apps that need it.
# Publisher: fairspot-booking  |  Subscribers: fairspot-notification, fairspot-audit, fairspot-reporting
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: fairspot-pubsub
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
  - name: host
    secretKeyRef:
      name: rabbitmq-host
      key: connectionString
  - name: durable
    value: "true"
  - name: deletedWhenUnused
    value: "false"
  - name: prefetchCount
    value: "10"
  - name: reconnectWait
    value: "5s"
  - name: enableTLS
    value: "true"
scopes:
- fairspot-booking
- fairspot-notification
- fairspot-audit
- fairspot-customer
- fairspot-reporting
auth:
  secretStore: secretstore
