# Build and run all FairSpot backend service containers.
#
# Build all images from a clean checkout:
#   docker compose -f code/infrastructure/docker-compose.services.yml build
#
# Run alongside the infrastructure stack:
#   docker compose \
#     -f code/infrastructure/docker-compose.yaml \
#     -f code/infrastructure/docker-compose.services.yml \
#     up -d
#
# Image names follow the pattern fps-<service>:local.
# Port assignments match the service launchSettings.json HTTP ports.
# Dapr sidecars are wired separately (see OPS014).

x-fps-service-auth-env: &fps-service-auth-env
  Auth__Authority: ${FPS_AUTH_AUTHORITY:-http://keycloak:8080/realms/fps-local}
  Auth__Audience: ${FPS_AUTH_AUDIENCE:-fps-mobile-dev}
  Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-fps-web-dev,fps-cli-dev}
  Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-true}
  Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-true}
  # PLAT001: the FairSpot-controlled realm's privileged roles may pass through for tenants
  # not yet explicitly mapped (the shared ConfiguredTenantRoleMapper strips privileged roles
  # otherwise). Clear/override this for a brokered-customer deployment that maps roles per tenant.
  Auth__TrustedRealmRoles: ${FPS_AUTH_TRUSTED_REALM_ROLES:-admin,hr_manager,auditor,report_viewer}
  # PLAT001 platform plane: setting a platform realm authority makes ConfigureFpsJwtBearer accept
  # BOTH the customer realm and the platform realm, and confines platform_* roles to the platform
  # issuer (TenantClaimsTransformation). Empty by default → platform plane dormant. Set these to
  # deploy platform-plane surfaces (e.g. the DataHub usage-stats API, the Customer tenant console).
  Auth__PlatformAuthority: ${FPS_AUTH_PLATFORM_AUTHORITY:-}
  Auth__PlatformIssuer: ${FPS_AUTH_PLATFORM_ISSUER:-}

services:

  fps-audit:
    image: fps-audit:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Audit
        PROJECT: FPS.Audit
        PORT: "5161"
    ports:
      - "5161:5161"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5161"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-booking:
    image: fps-booking:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Booking
        PROJECT: FPS.Booking
        PORT: "5131"
    ports:
      - "5131:5131"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5131"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
      ProfileService__BaseUrl: "http://fps-profile:5197"
    networks:
      - web

  fps-configuration:
    image: fps-configuration:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Configuration
        PROJECT: FPS.Configuration
        PORT: "5141"
    ports:
      - "5141:5141"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5141"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-customer:
    image: fps-customer:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Customer
        PROJECT: FPS.Customer
        PORT: "5181"
    ports:
      - "5181:5181"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5181"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
      DemoSeed__ProfileBaseUrl: "http://fps-profile:5197"
      DemoSeed__ConfigurationBaseUrl: "http://fps-configuration:5141"
      # PLAT003C-C3: sandbox-reset activation. OFF by default (fail closed) so Production/NAS and a
      # plain `up` stay inert; set FPS_SANDBOX_RESET_ENABLED=true only for a demo / Green Logistics
      # evaluation profile. Even when enabled the reset refuses any tenant that is not a stored
      # resettable sandbox, so real customer tenants can never be reset through this path. The
      # scheduler flag arms the nightly sandbox-reset-scheduler cron tick (a safe no-op while
      # Enabled is false).
      SandboxReset__Enabled: ${FPS_SANDBOX_RESET_ENABLED:-false}
      SandboxReset__Scheduler__Enabled: ${FPS_SANDBOX_RESET_SCHEDULER_ENABLED:-false}
      Readiness__ProfileBaseUrl: "http://fps-profile:5197"
      Readiness__BookingBaseUrl: "http://fps-booking:5131"
      Readiness__NotificationBaseUrl: "http://fps-notification:5157"
      Readiness__AuditBaseUrl: "http://fps-audit:5161"
      Readiness__ReportingBaseUrl: "http://fps-reporting:5171"
    networks:
      - web

  fps-datahub:
    image: fps-datahub:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: DataHub
        PROJECT: FPS.DataHub
        PORT: "5211"
    ports:
      - "5211:5211"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5211"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DataHub: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fps_datahub};Username=${POSTGRES_USER:-fps};Password=${POSTGRES_PASSWORD:-fps}"
    networks:
      - web

  fps-identity:
    image: fps-identity:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Identity
        PROJECT: FPS.Identity
        PORT: "5192"
    ports:
      - "5192:5192"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5192"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-notification:
    image: fps-notification:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Notification
        PROJECT: FPS.Notification
        PORT: "5157"
    ports:
      - "5157:5157"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5157"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-profile:
    image: fps-profile:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Profile
        PROJECT: FPS.Profile
        PORT: "5197"
    ports:
      - "5197:5197"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5197"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-reporting:
    image: fps-reporting:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: Reporting
        PROJECT: FPS.Reporting
        PORT: "5171"
    ports:
      - "5171:5171"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5171"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

networks:
  web:
    external: true
    name: fps_network
