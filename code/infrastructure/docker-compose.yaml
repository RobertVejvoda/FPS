services:
  envoy-proxy:
    image: envoyproxy/envoy:v1.33.1  # Use a recent Envoy version
    ports:
      - "10000:10000"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml  # Mount Envoy configuration
    networks:
      - web

  vault:
    image: hashicorp/vault:${VAULT_IMAGE_VERSION:-1.18}
    # Internal secret store — loopback only (containers use vault:8200).
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - web
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
      - VAULT_ADDRESS=http://0.0.0.0:8200
    volumes:
      - vault_data:/vault/data
    # Local dev mode matches the checked-in Dapr local component token.
    # Do not mount /vault/config in dev mode, or the listener is loaded twice.
    command: server -dev -dev-root-token-id=${VAULT_TOKEN:-dev-only-token} -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    # Internal object store — loopback only (containers use minio:9000).
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    networks:
      - web
    

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASS:-admin}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - web
    command: start-dev --http-enabled=true
    

  rabbitmq:
    image: rabbitmq:3-management
    # Internal broker — loopback only (containers use rabbitmq:5672; Prometheus
    # scrapes :15692 over the Docker network).
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-admin}
    # Enable prometheus plugin so GET :15692/metrics is available for scraping
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    networks:
      - web
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    

  postgres:
    image: postgres:16
    # Internal datastore — bind to loopback so it is never reachable on the host
    # LAN interface. Containers reach it over the Docker network (postgres:5432).
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fps}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fps}
      - POSTGRES_DB=${POSTGRES_DB:-fps_datahub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fps} -d ${POSTGRES_DB:-fps_datahub}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:latest
    # Internal datastore — loopback only (containers use mongodb:27017).
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:-admin}
    volumes:
      - mongodb_data:/data/db
    entrypoint: >
      bash -c "tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > /data/configdb/keyfile
      && chmod 400 /data/configdb/keyfile
      && chown mongodb:mongodb /data/configdb/keyfile
      && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/keyfile"
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb-init:
    image: mongo:latest
    networks:
      - web
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    environment:
      MONGO_USER: "${MONGO_USER:-admin}"
      MONGO_PASS: "${MONGO_PASS:-admin}"
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        mongosh --quiet \
          --username "$$MONGO_USER" \
          --password "$$MONGO_PASS" \
          --authenticationDatabase admin \
          --host mongodb:27017 \
          --eval '
            const expected = "mongodb:27017";
            const desired = { _id: "rs0", members: [{ _id: 0, host: expected }] };
            try {
              const status = rs.status();
              if (status.ok === 1) {
                const cfg = rs.conf();
                if (cfg.members.length !== 1 || cfg.members[0].host !== expected) {
                  cfg.members = desired.members;
                  cfg.version = (cfg.version || 1) + 1;
                  rs.reconfig(cfg, { force: true });
                  print("Mongo replica set reconfigured for Docker DNS.");
                } else {
                  print("Mongo replica set already configured.");
                }
              }
            } catch (e) {
              rs.initiate(desired);
              print("Mongo replica set initialized.");
            }
          '
    

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - web
    

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    # host-gateway mapping makes host.docker.internal resolve on Linux (macOS/Windows do it automatically)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web
    

  alertmanager:
    image: prom/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/${ALERTMANAGER_CONFIG_FILE:-config.yaml}:/etc/alertmanager/config.yaml:ro
    command:
      - '--config.file=/etc/alertmanager/config.yaml'
      - '--storage.path=/alertmanager'
    networks:
      - web
    

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - web

  promtail:
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - ../../logs/local-harness:/logs/local-harness:ro
    depends_on:
      - loki
    networks:
      - web

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    networks:
      - web
    

  zipkin:
    image: openzipkin/zipkin
    ports:
      # Keep host 9411 free for `dapr init`, which starts Dapr's default Zipkin.
      - "19411:9411"
    networks:
      - web
    

volumes:
  minio_data:
  mongodb_data:
  postgres_data:
  keycloak_postgres_data:
  prometheus_data:
  grafana_data:
  vault_data:
  loki_data:

networks:
  web:
    name: fps_network
    external: true
