server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fps-local-harness
    static_configs:
      - targets:
          - localhost
        labels:
          environment: local
          source: local-harness
          __path__: /logs/local-harness/*.log
    relabel_configs:
      - source_labels: [__path__]
        target_label: service
        regex: '/logs/local-harness/(.+)\.log'
        replacement: '${1}'
