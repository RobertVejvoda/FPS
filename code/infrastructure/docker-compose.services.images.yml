# Image-only FairSpot service definitions for the NAS / pulled-image profile.
#
# This file has NO build sections — every service runs a pre-built image pulled
# from a registry (GHCR by default). The NAS host therefore needs no source build
# context, .NET SDK, Node, npm, or Dapr CLI.
#
# Use this INSTEAD of docker-compose.services.yml for the NAS profile:
#   docker compose --env-file nas.env \
#     -f docker-compose.yaml \
#     -f docker-compose.services.images.yml \
#     -f docker-compose.dapr.yml \
#     -f docker-compose.nas.yml \
#     pull
#   docker compose --env-file nas.env \
#     -f docker-compose.yaml \
#     -f docker-compose.services.images.yml \
#     -f docker-compose.dapr.yml \
#     -f docker-compose.nas.yml \
#     up -d
#
# Image selection (override in .env):
#   FPS_REGISTRY    registry + owner prefix. Default: ghcr.io/robertvejvoda
#   FPS_IMAGE_TAG   image tag. Default: latest. Pin a sha-<commit> for repeatable
#                   deploys and easy rollback (see the NAS deployment runbook).

x-fps-service-auth-env: &fps-service-auth-env
  Auth__Authority: ${FPS_AUTH_AUTHORITY:-http://keycloak:8080/realms/fps-local}
  Auth__Audience: ${FPS_AUTH_AUDIENCE:-fps-mobile-dev}
  Auth__AdditionalAudiences: ${FPS_AUTH_ADDITIONAL_AUDIENCES:-fps-web-dev,fps-cli-dev}
  Auth__AllowHttpMetadata: ${FPS_AUTH_ALLOW_HTTP_METADATA:-true}
  Auth__AllowLocalIssuerHostOverride: ${FPS_AUTH_ALLOW_LOCAL_ISSUER_HOST_OVERRIDE:-true}

services:

  fps-audit:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-audit:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5161:5161"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5161"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-booking:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-booking:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5131:5131"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5131"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
      ProfileService__BaseUrl: "http://fps-profile:5197"
    networks:
      - web

  fps-configuration:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-configuration:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5141:5141"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5141"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-customer:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-customer:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5181:5181"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5181"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
      DemoSeed__ProfileBaseUrl: "http://fps-profile:5197"
      DemoSeed__ConfigurationBaseUrl: "http://fps-configuration:5141"
      Readiness__ProfileBaseUrl: "http://fps-profile:5197"
      Readiness__BookingBaseUrl: "http://fps-booking:5131"
      Readiness__NotificationBaseUrl: "http://fps-notification:5157"
      Readiness__AuditBaseUrl: "http://fps-audit:5161"
      Readiness__ReportingBaseUrl: "http://fps-reporting:5171"
    networks:
      - web

  fps-datahub:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-datahub:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5211:5211"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5211"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DataHub: "Host=postgres;Port=5432;Database=fps_datahub;Username=fps;Password=fps"
    networks:
      - web

  fps-identity:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-identity:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5192:5192"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5192"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-notification:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-notification:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5157:5157"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5157"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-profile:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-profile:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5197:5197"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5197"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  fps-reporting:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-reporting:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5171:5171"
    environment:
      <<: *fps-service-auth-env
      ASPNETCORE_URLS: "http://+:5171"
      ASPNETCORE_ENVIRONMENT: ${FPS_ASPNETCORE_ENVIRONMENT:-Production}
    networks:
      - web

  # Web SPA (nginx). Runtime /config.json is generated from FPS_WEB_* env vars
  # (see code/web/fps-web/docker-entrypoint.sh); without them the baked default
  # is served. Public exposure (Cloudflare hostname) is handled separately.
  fps-web:
    image: ${FPS_REGISTRY:-ghcr.io/robertvejvoda}/fps-web:${FPS_IMAGE_TAG:-latest}
    ports:
      - "5200:80"
    environment:
      FPS_WEB_API_BASE_URL: ${FPS_WEB_API_BASE_URL:-}
      FPS_WEB_OIDC_AUTHORITY: ${FPS_WEB_OIDC_AUTHORITY:-}
      FPS_WEB_OIDC_CLIENT_ID: ${FPS_WEB_OIDC_CLIENT_ID:-}
      FPS_WEB_OIDC_SCOPES: ${FPS_WEB_OIDC_SCOPES:-openid profile email}
      FPS_WEB_OIDC_REDIRECT_URI: ${FPS_WEB_OIDC_REDIRECT_URI:-}
      FPS_WEB_OIDC_POST_LOGOUT_REDIRECT_URI: ${FPS_WEB_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      FPS_WEB_PRODUCT_NAME: ${FPS_WEB_PRODUCT_NAME:-FairSpot}
      FPS_WEB_TENANT_NAME: ${FPS_WEB_TENANT_NAME:-}
      FPS_WEB_ENVIRONMENT: ${FPS_WEB_ENVIRONMENT:-Production}
    networks:
      - web

networks:
  web:
    external: true
    name: fps_network
