static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - exact: "http://localhost:5200"
                        allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                        allow_headers: "authorization,content-type,accept"
                        expose_headers: "content-disposition"
                        max_age: "86400"
                      routes:
                        # Local-only gateway health probes. These replace the
                        # old whoami/Dapr sample route with checks against
                        # real FairSpot services.
                        - match:
                            prefix: "/health/identity"
                          route:
                            cluster: fairspot-identity
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/booking"
                          route:
                            cluster: fairspot-booking
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/notification"
                          route:
                            cluster: fairspot-notification
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/profile"
                          route:
                            cluster: fairspot-profile
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/audit"
                          route:
                            cluster: fairspot-audit
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/reporting"
                          route:
                            cluster: fairspot-reporting
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/configuration"
                          route:
                            cluster: fairspot-configuration
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/customer"
                          route:
                            cluster: fairspot-customer
                            prefix_rewrite: "/health"
                        - match:
                            prefix: "/health/datahub"
                          route:
                            cluster: fairspot-datahub
                            prefix_rewrite: "/health"
                        # Employee mobile API surface — routes to host-run services.
                        # host.docker.internal resolves to the host on macOS/Windows Docker Desktop.
                        # On Linux: add --add-host=host.docker.internal:host-gateway to the envoy
                        # service in docker-compose.yaml, or replace with 172.17.0.1.
                        - match:
                            prefix: "/profile"
                          route:
                            cluster: fairspot-profile
                        - match:
                            prefix: "/notifications"
                          route:
                            cluster: fairspot-notification
                        - match:
                            prefix: "/bookings"
                          route:
                            cluster: fairspot-booking
                        - match:
                            prefix: "/draws"
                          route:
                            cluster: fairspot-booking
                        - match:
                            prefix: "/simulation"
                          route:
                            cluster: fairspot-booking
                        - match:
                            prefix: "/reports"
                          route:
                            cluster: fairspot-reporting
                        - match:
                            prefix: "/audit"
                          route:
                            cluster: fairspot-audit
                        - match:
                            prefix: "/configuration"
                          route:
                            cluster: fairspot-configuration
                        - match:
                            prefix: "/tenants"
                          route:
                            cluster: fairspot-customer
                        - match:
                            prefix: "/datahub"
                          route:
                            cluster: fairspot-datahub
                        - match:
                            path: "/me"
                          route:
                            cluster: fairspot-identity
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: fairspot-identity
      connect_timeout: 1s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: fairspot-identity
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 5192 }

    - name: fairspot-booking
      connect_timeout: 1s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
