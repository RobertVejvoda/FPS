# DigitalOcean Droplet delta — loopback Grafana convenience (#766).
#
# DELTA-ONLY. Public-port suppression is shared with NAS in
# docker-compose.no-host-ports.yml. This file adds back one loopback-only
# Grafana binding for SSH-tunnel access on a Droplet. It MUST be applied after
# the shared no-host-ports overlay.
#
# Full DigitalOcean profile (what tools/deploy-digitalocean.sh and the compose
# resolver assemble):
#   docker compose --env-file do.env \
#     -f docker-compose.yaml \
#     -f docker-compose.services.images.yml \
#     -f docker-compose.dapr.yml \
#     -f docker-compose.nas.yml \
#     -f docker-compose.services.nas.yml \
#     -f docker-compose.no-host-ports.yml \
#     -f docker-compose.digitalocean.yml \
#     up -d

services:
  # Grafana is pinned to 127.0.0.1 so it is reachable only via
  # `ssh -L ${FPS_GRAFANA_HOST_PORT:-3001}:127.0.0.1:${FPS_GRAFANA_HOST_PORT:-3001} <droplet>`
  # (or Cloudflare Access), never the public interface.
  grafana:
    ports: !override
      - "127.0.0.1:${FPS_GRAFANA_HOST_PORT:-3001}:3000"
