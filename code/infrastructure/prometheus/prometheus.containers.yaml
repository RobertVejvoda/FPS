# Prometheus targets for the full container stack (Local container and hosted).
# Services share fairspot_network, so scrape by stable Docker DNS without host ports.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yaml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fairspot-identity'
    static_configs:
      - targets: ['fairspot-identity:5192']
    metrics_path: /metrics

  - job_name: 'fairspot-booking'
    static_configs:
      - targets: ['fairspot-booking:5131']
    metrics_path: /metrics

  - job_name: 'fairspot-notification'
    static_configs:
      - targets: ['fairspot-notification:5157']
    metrics_path: /metrics

  - job_name: 'fairspot-profile'
    static_configs:
      - targets: ['fairspot-profile:5197']
    metrics_path: /metrics

  - job_name: 'fairspot-audit'
    static_configs:
      - targets: ['fairspot-audit:5161']
    metrics_path: /metrics

  - job_name: 'fairspot-reporting'
    static_configs:
      - targets: ['fairspot-reporting:5171']
    metrics_path: /metrics

  - job_name: 'fairspot-configuration'
    static_configs:
      - targets: ['fairspot-configuration:5141']
    metrics_path: /metrics

  - job_name: 'fairspot-customer'
    static_configs:
      - targets: ['fairspot-customer:5181']
    metrics_path: /metrics

  - job_name: 'fairspot-datahub'
    static_configs:
      - targets: ['fairspot-datahub:5211']
    metrics_path: /metrics

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics
