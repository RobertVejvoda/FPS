groups:
  - name: fps_service_health
    interval: 15s
    rules:
      - alert: FpsServiceDown
        expr: up{job=~"fairspot-.*"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "FPS service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }}). Check that the service is running and the local harness is active."
          runbook: "docs/local-observability.md#finding-a-failing-service"

      - alert: FpsHighErrorRate
        expr: |
          (
            sum by (job) (rate(http_requests_received_total{job=~"fairspot-.*", code=~"5.."}[2m]))
            /
            sum by (job) (rate(http_requests_received_total{job=~"fairspot-.*"}[2m]))
          ) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "More than 5% of requests to {{ $labels.job }} are returning 5xx errors over the last 2 minutes."
          runbook: "Check service logs and recent deployments for {{ $labels.job }}."

      - alert: FpsHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_request_duration_seconds_bucket{job=~"fairspot-.*"}[2m]))
          ) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "95th-percentile request latency on {{ $labels.job }} exceeds 2 seconds."
          runbook: "Check for slow database queries, Dapr sidecar issues, or resource contention."

  - name: fps_infrastructure
    interval: 15s
    rules:
      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ is unreachable"
          description: "Prometheus cannot scrape RabbitMQ metrics. Booking events and notifications will stall."
          runbook: "Run: docker compose -f code/infrastructure/docker-compose.yaml up -d rabbitmq"

      - alert: RabbitMQHighQueueDepth
        expr: rabbitmq_queue_messages > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} has {{ $value }} messages"
          description: "Queue depth suggests a consumer is not keeping up. Check that Dapr sidecars are running."
          runbook: "Run: ./tools/start-local-harness.sh to restart Dapr sidecars."

  # Gap: EnvoyGatewayDown is not implemented here.
  # The envoy-proxy:10000 target is the public API listener, not an Envoy admin/metrics
  # endpoint, so scraping /metrics on that port is unreliable. A proper gateway health
  # alert requires enabling the Envoy admin interface (default :9901) as a separate
  # scrape target. This is deferred to a follow-up infra slice.
