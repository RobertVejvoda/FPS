global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yaml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dapr'
    static_configs:
      # whoami-dapr uses network_mode: service:whoami, so its metrics endpoint
      # is reachable through the whoami service name inside the Compose network.
      - targets: ['whoami:9090']

  # FPS .NET services — each exposes GET /metrics via prometheus-net
  - job_name: 'fps-identity'
    static_configs:
      - targets: ['host.docker.internal:5192']
    metrics_path: /metrics

  - job_name: 'fps-booking'
    static_configs:
      - targets: ['host.docker.internal:5131']
    metrics_path: /metrics

  - job_name: 'fps-notification'
    static_configs:
      - targets: ['host.docker.internal:5157']
    metrics_path: /metrics

  - job_name: 'fps-profile'
    static_configs:
      - targets: ['host.docker.internal:5197']
    metrics_path: /metrics

  - job_name: 'fps-audit'
    static_configs:
      - targets: ['host.docker.internal:5161']
    metrics_path: /metrics

  - job_name: 'fps-reporting'
    static_configs:
      - targets: ['host.docker.internal:5171']
    metrics_path: /metrics

  - job_name: 'fps-configuration'
    static_configs:
      - targets: ['host.docker.internal:5141']
    metrics_path: /metrics

  - job_name: 'fps-customer'
    static_configs:
      - targets: ['host.docker.internal:5181']
    metrics_path: /metrics

  - job_name: 'fps-datahub'
    static_configs:
      - targets: ['host.docker.internal:5211']
    metrics_path: /metrics

  # Infrastructure dependencies
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics

  # Keycloak start-dev mode does not expose a /metrics endpoint — omitted intentionally.
