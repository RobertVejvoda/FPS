global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yaml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FPS .NET services — each exposes GET /metrics via prometheus-net
  - job_name: 'fairspot-identity'
    static_configs:
      - targets: ['host.docker.internal:5192']
    metrics_path: /metrics

  - job_name: 'fairspot-booking'
    static_configs:
      - targets: ['host.docker.internal:5131']
    metrics_path: /metrics

  - job_name: 'fairspot-notification'
    static_configs:
      - targets: ['host.docker.internal:5157']
    metrics_path: /metrics

  - job_name: 'fairspot-profile'
    static_configs:
      - targets: ['host.docker.internal:5197']
    metrics_path: /metrics

  - job_name: 'fairspot-audit'
    static_configs:
      - targets: ['host.docker.internal:5161']
    metrics_path: /metrics

  - job_name: 'fairspot-reporting'
    static_configs:
      - targets: ['host.docker.internal:5171']
    metrics_path: /metrics

  - job_name: 'fairspot-configuration'
    static_configs:
      - targets: ['host.docker.internal:5141']
    metrics_path: /metrics

  - job_name: 'fairspot-customer'
    static_configs:
      - targets: ['host.docker.internal:5181']
    metrics_path: /metrics

  - job_name: 'fairspot-datahub'
    static_configs:
      - targets: ['host.docker.internal:5211']
    metrics_path: /metrics

  # Infrastructure dependencies
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics

  # Keycloak start-dev mode does not expose a /metrics endpoint — omitted intentionally.
