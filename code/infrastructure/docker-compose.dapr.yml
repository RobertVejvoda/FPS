# Dapr system services + per-app sidecars + Vault seed for the local-container profile.
#
# Profile: local-container (internal Docker-only run — no host Dapr CLI or .NET required)
# NOT NAS/production: Vault token defaults to dev-only-token via VAULT_TOKEN env var.
# For NAS-hosted: inject VAULT_TOKEN and set DAPR_RUNTIME_VERSION / VAULT_IMAGE_VERSION
# to match the deployed runtime.
#
# Combined bring-up (from repo root):
#   docker compose \
#     -f code/infrastructure/docker-compose.yaml \
#     -f code/infrastructure/docker-compose.services.yml \
#     -f code/infrastructure/docker-compose.dapr.yml \
#     up -d
#
# Image strategy:
#   DAPR_RUNTIME_VERSION (env, default 1.18.0) controls Dapr runtime image tags.
#   Keep this separate from .NET SDK package versions such as 1.18.4: not every
#   SDK patch release has a matching Docker runtime image tag.
#   System services (placement, scheduler) use daprio/dapr which contains all
#   binaries. Sidecars use daprio/daprd, the lean sidecar image.
#
# Placement (actors) and Scheduler (workflow reminders) are both required for Dapr 1.14+.
#
# Each sidecar uses network_mode: "service:<app>" so it shares the app container's
# loopback: daprd reaches the app on localhost:<app-port>, and the app reaches Dapr
# on localhost:3500 (HTTP) / localhost:50001 (gRPC).

x-dapr-system: &dapr-system
  image: daprio/dapr:${DAPR_RUNTIME_VERSION:-1.18.0}
  restart: unless-stopped

x-dapr-sidecar-base: &dapr-sidecar-base
  image: daprio/daprd:${DAPR_RUNTIME_VERSION:-1.18.0}
  volumes:
    - ./dapr/components/container:/dapr/components:ro
    - ./dapr/configuration:/dapr/config:ro
  secrets:
    - vault_token
  restart: unless-stopped

services:

  # Every full service-container profile includes this overlay. Select the
  # Docker-DNS scrape config here so the two service definition files remain
  # valid standalone build/image manifests; infrastructure-only + host-harness
  # mode keeps the base host.docker.internal configuration.
  prometheus:
    volumes:
      - ./prometheus/prometheus.containers.yaml:/etc/prometheus/prometheus.yaml:ro

  # ── Vault secret seed ───────────────────────────────────────────────────────
  # Seeds the three Dapr secrets on a clean host without host Vault CLI or Dapr CLI.
  # Runs once and exits (restart: "no"). For NAS: override VAULT_TOKEN and credentials
  # as env vars; do not re-seed if Vault already has the secrets.

  vault-init:
    image: hashicorp/vault:${VAULT_IMAGE_VERSION:-1.18}
    networks:
      - web
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
    restart: "no"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-dev-only-token}"
      MONGO_USER: "${MONGO_USER:-admin}"
      MONGO_PASS: "${MONGO_PASS:-admin}"
      RABBITMQ_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_PASS: "${RABBITMQ_PASS:-admin}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      # NOTIF #722: real SendGrid API key for the notification-email binding. Empty by
      # default so local/dev seeds without it. On NAS, set SENDGRID_API_KEY in the ignored
      # operator env source (code/infrastructure/nas.env) — it already feeds compose/vault-init.
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        vault kv put secret/dapr/mongodb-credentials \
          username="$$MONGO_USER" password="$$MONGO_PASS"
        vault kv put secret/dapr/rabbitmq-credentials \
          username="$$RABBITMQ_USER" password="$$RABBITMQ_PASS"
        vault kv put secret/dapr/minio-credentials \
          accessKey="$$MINIO_ACCESS_KEY" secretKey="$$MINIO_SECRET_KEY"
        # NOTIF #722: only seed the SendGrid secret when a key is supplied, so the
        # notification-email binding's secretKeyRef (sendgrid-credentials/apiKey) resolves.
        # The real key lives only in the ignored operator env / Vault — never in tracked files.
        if [ -n "$$SENDGRID_API_KEY" ]; then
          vault kv put secret/dapr/sendgrid-credentials apiKey="$$SENDGRID_API_KEY"
          echo "SendGrid credentials seeded."
        else
          echo "SENDGRID_API_KEY not set; skipping SendGrid secret (notification-email binding stays unconfigured)."
        fi
        echo "Vault secrets seeded."

  # ── Dapr system services ────────────────────────────────────────────────────

  dapr-placement:
    <<: *dapr-system
    command:
      - "./placement"
      - "--port"
      - "50006"
      - "--log-level"
      - "info"
    networks:
      - web

  dapr-scheduler:
    <<: *dapr-system
    # The Dapr 1.18 scheduler image runs as a non-root user by default; run the
    # local/NAS scheduler as root so the mounted scheduler volume is writable.
    user: "0:0"
    command:
      - "./scheduler"
      - "--port"
      - "50007"
      - "--etcd-data-dir"
      - "/var/lock/dapr/scheduler"
      - "--log-level"
      - "info"
    volumes:
      - dapr_scheduler_data:/var/lock/dapr/scheduler
    networks:
      - web
    depends_on:
      - dapr-placement

  # ── Per-app Dapr sidecars ───────────────────────────────────────────────────

  fairspot-audit-dapr:
    <<: *dapr-sidecar-base
    command:
      - "./daprd"
      - "--app-id"
      - "fairspot-audit"
      - "--app-port"
      - "5161"
      - "--dapr-http-port"
      - "3500"
      - "--dapr-grpc-port"
      - "50001"
      - "--metrics-port"
      - "9090"
      - "--placement-host-address"
      - "dapr-placement:50006"
      - "--scheduler-host-address"
      - "dapr-scheduler:50007"
      - "--components-path"
      - "/dapr/components"
      - "--config"
      - "/dapr/config/fairspot-config.yaml"
      - "--log-level"
      - "info"
    environment:
      VAULT_TOKEN: "${VAULT_TOKEN:-dev-only-token}"
    network_mode: "service:fairspot-audit"
    depends_on:
      fairspot-audit:
        condition: service_started
      dapr-placement:
        condition: service_started
      dapr-scheduler:
        condition: service_started
      vault-init:
        condition: service_completed_successfully

  fairspot-booking-dapr:
