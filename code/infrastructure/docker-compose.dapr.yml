      - "--app-id"
      - "fairspot-booking"
      - "--app-port"
      - "5131"
      - "--dapr-http-port"
      - "3500"
      - "--dapr-grpc-port"
      - "50001"
      - "--metrics-port"
      - "9090"
      - "--placement-host-address"
      - "dapr-placement:50006"
      - "--scheduler-host-address"
      - "dapr-scheduler:50007"
      - "--components-path"
      - "/dapr/components"
      - "--config"
      - "/dapr/config/fairspot-config.yaml"
      - "--log-level"
      - "info"
    environment:
