  # ── App service env-var overrides ──────────────────────────────────────────
  # Inject Dapr port variables so each service's startup health poll fires
  # and Customer's IdentityStoreHydrator waits for the sidecar before hydrating.

  fairspot-audit:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-booking:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-configuration:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-customer:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-datahub:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-identity:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-notification:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-profile:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  fairspot-reporting:
    environment:
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  # ── Envoy override ──────────────────────────────────────────────────────────
  # Switch Envoy clusters from host.docker.internal to Docker DNS service names.
  # Mount the container config to a separate path and override the command to
  # avoid a duplicate bind mount on /etc/envoy/envoy.yaml.

  envoy-proxy:
    volumes:
      - ./envoy/envoy-container.yaml:/etc/envoy/envoy-container.yaml:ro
    command:
      - "envoy"
      - "-c"
      - "/etc/envoy/envoy-container.yaml"
      - "--log-level"
      - "warn"

volumes:
  dapr_scheduler_data:

secrets:
  vault_token:
    environment: VAULT_TOKEN

networks:
  web:
    external: true
    name: fairspot_network
